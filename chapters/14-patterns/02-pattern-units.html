<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>14-2 patternUnits vs patternContentUnits</title>
  <style>
    .readout { margin: 0; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); text-align: center; }
    select, input { accent-color: var(--accent); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">patternUnits
      <select id="units"><option>userSpaceOnUse</option><option>objectBoundingBox</option></select>
    </label>
    <label class="control">patternContentUnits
      <select id="content"><option>userSpaceOnUse</option><option>objectBoundingBox</option></select>
    </label>
    <label class="control"><input id="outline" type="checkbox" checked> tile outline</label>
  </div>
  <div class="stage">
    <svg width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="Three shapes of different sizes filled with the same pattern">
      <defs><pattern id="dots"></pattern></defs>
      <g fill="url(#dots)" stroke="var(--fg)" stroke-width="1.5">
        <rect x="20" y="20" width="280" height="160"/>
        <rect x="330" y="20" width="80" height="220"/>
        <rect x="440" y="20" width="100" height="100"/>
      </g>
    </svg>
  </div>
  <p class="readout" id="readout"></p>
  <script>
    const $ = (id) => document.getElementById(id);
    function update() {
      const userTile = $('units').value === 'userSpaceOnUse';
      const userContent = $('content').value === 'userSpaceOnUse';
      const p = $('dots');
      // Tile size: 40 user units, or a quarter of each shape's bounding box
      const w = userTile ? 40 : .25, h = userTile ? 40 : .25;
      p.setAttribute('patternUnits', $('units').value);
      p.setAttribute('patternContentUnits', $('content').value);
      p.setAttribute('width', w);
      p.setAttribute('height', h);
      // Content: a dot in the middle of a 40 x 40 tile, or of a 0.25 x 0.25 tile in bounding-box fractions
      const c = userContent ? { cx: 20, cy: 20, r: 12, box: 40 } : { cx: .125, cy: .125, r: .075, box: .25 };
      // Tile outline: thin bands along the top and left edge of each tile, in the same units as the content
      const t = userContent ? 1.5 : .006;
      const outline = $('outline').checked
        ? `<path d="M0 0H${c.box}V${t}H0Z M0 0H${t}V${c.box}H0Z" fill="#f97316"/>` : '';
      p.innerHTML = `<rect width="${c.box}" height="${c.box}" fill="#dbeafe"/><circle cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="#2563eb"/>` + outline;
      $('readout').textContent = `<pattern width="${w}" height="${h}" patternUnits="${p.getAttribute('patternUnits')}" patternContentUnits="${p.getAttribute('patternContentUnits')}">`;
    }
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
