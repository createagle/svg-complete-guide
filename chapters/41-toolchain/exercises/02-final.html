<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 41-2 · Finished</title>
  <style>
    .nav { display: flex; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 14px; }
    .nav a { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; color: var(--accent); text-decoration: none; font-size: 16px; }
    .nav a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .nav svg, .nav img { width: 24px; height: 24px; }
    .nav svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body class="demo">
  <!-- One inline sprite; each <symbol> is drawn by <use>, so it inherits the link color -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></symbol>
    </defs>
  </svg>
  <nav class="nav" aria-label="Main">
    <a href="#"><svg aria-hidden="true"><use href="#i-home"/></svg> Home</a>
    <a href="#"><svg aria-hidden="true"><use href="#i-search"/></svg> Search</a>
    <a href="#"><svg aria-hidden="true"><use href="#i-user"/></svg> User</a>
  </nav>
</body>
</html>
