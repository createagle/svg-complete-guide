<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>40-2 Rendering Cost Lab</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    input, select { accent-color: var(--accent); }
    .control output { min-width: 1.4em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    #view { border: 1px solid var(--border); border-radius: 12px; }
    #world circle { fill: var(--accent); fill-opacity: .7; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Shapes <select id="n"><option>100</option><option selected>1000</option><option>5000</option><option>10000</option></select></label>
    <label class="control">Update <select id="mode">
      <option value="group">one transform on the group</option>
      <option value="attrs">cx / cy on every circle</option>
      <option value="blur">cx / cy + blur filter</option>
    </select></label>
    <button id="toggle" class="btn" type="button">Pause</button>
  </div>
  <svg id="view" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Many small circles swirling">
    <defs><filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.5"/></filter></defs>
    <g id="world" transform-origin="240 150"></g>
  </svg>
  <pre id="out" class="out" role="status"></pre>
  <script>
    const $ = (id) => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
    const world = $('world');
    let dots = [], seeds = [];
    function build() {
      const n = +$('n').value;
      seeds = Array.from({ length: n }, (_, i) => ({ a: (i * 2.399963) % (Math.PI * 2), r: 12 + 130 * Math.sqrt((i + 0.5) / n), s: 0.4 + (i % 7) / 10 }));
      dots = seeds.map((d) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 2.2); return c; });
      world.replaceChildren(...dots);
      world.setAttribute('filter', $('mode').value === 'blur' ? 'url(#soft)' : '');
      place(0, true);
    }
    // Lay every circle out once; the "group" mode then only rotates the group
    function place(t, all) {
      const mode = $('mode').value;
      if (mode === 'group' && !all) { world.setAttribute('transform', 'rotate(' + (t * 0.02).toFixed(2) + ')'); return; }
      if (mode !== 'group') world.removeAttribute('transform');
      for (let i = 0; i < dots.length; i++) {
        const d = seeds[i], a = d.a + (mode === 'group' ? 0 : t * 0.00035 * d.s * 2);
        dots[i].setAttribute('cx', (240 + Math.cos(a) * d.r).toFixed(1));
        dots[i].setAttribute('cy', (150 + Math.sin(a) * d.r * 0.9).toFixed(1));
      }
    }
    // Frame time: the average gap between the last 60 animation frames
    const gaps = []; let last = 0, running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    function frame(now) {
      if (last) { gaps.push(now - last); if (gaps.length > 60) gaps.shift(); }
      last = now;
      if (running) place(now, false);
      const avg = gaps.reduce((s, g) => s + g, 0) / (gaps.length || 1);
      $('out').textContent = 'shapes: ' + dots.length + ' · DOM nodes in the svg: ' + $('view').querySelectorAll('*').length + '\nframe time: ' + avg.toFixed(1) + ' ms (' + (1000 / avg).toFixed(0) + ' fps)' + (running ? '' : ' · paused');
      requestAnimationFrame(frame);
    }
    $('toggle').textContent = running ? 'Pause' : 'Play';
    $('toggle').addEventListener('click', () => { running = !running; $('toggle').textContent = running ? 'Pause' : 'Play'; });
    $('n').addEventListener('input', build);
    $('mode').addEventListener('input', build);
    build(); requestAnimationFrame(frame);
  </script>
</body>
</html>
