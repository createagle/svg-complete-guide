<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 22-2 · Starter</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="320" height="220" viewBox="0 0 320 220" role="img" aria-label="A card that is blurred and shifted instead of casting a shadow">
    <defs>
      <filter id="shadow">
        <feGaussianBlur stdDeviation="4"/>
        <feOffset dx="6" dy="6"/>
      </filter>
    </defs>
    <rect width="320" height="220" rx="16" fill="#f5f5f4"/>
    <g filter="url(#shadow)">
      <rect x="60" y="40" width="200" height="120" rx="14" fill="#fff"/>
      <circle cx="104" cy="84" r="22" fill="#f59e0b"/>
      <rect x="138" y="72" width="96" height="10" rx="5" fill="#a8a29e"/>
      <rect x="138" y="90" width="64" height="10" rx="5" fill="#d6d3d1"/>
      <rect x="84" y="122" width="150" height="14" rx="7" fill="#2563eb"/>
    </g>
  </svg>
  </div>
</body>
</html>
