<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 24-2 · Finished</title>

<body class="demo">
  <div class="stage">
    <svg width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Flat illustration of mountains, a sun, a tree and a river, in indigo and yellow">
      <defs>
        <filter id="duotone" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.192 0.992"/>
            <feFuncG type="table" tableValues="0.180 0.902"/>
            <feFuncB type="table" tableValues="0.506 0.541"/>
          </feComponentTransfer>
        </filter>
      </defs>
      <image href="../photo.jpg" width="480" height="320" filter="url(#duotone)"/>
    </svg>
  </div>
</body>
</html>
