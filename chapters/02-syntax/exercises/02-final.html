<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2-2 · Finished</title>
  <link rel="stylesheet" href="../../../assets/style.css">
  <style>
    circle { fill: green; }
    #c, #d { fill: purple; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <figure>
      <svg viewBox="0 0 10 10" width="160" height="160">
        <circle id="c" cx="5" cy="5" r="4" fill="blue" style="fill: orange"/>
      </svg>
      <figcaption>With style="fill: orange"</figcaption>
    </figure>
    <figure>
      <svg viewBox="0 0 10 10" width="160" height="160">
        <circle id="d" cx="5" cy="5" r="4" fill="blue"/>
      </svg>
      <figcaption>Without the style attribute</figcaption>
    </figure>
  </div>
</body>
</html>
