<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>47-3 Linked Dashboard</title>
  <style>
    .dash { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; width: min(980px, 100%); align-items: start; }
    @media (max-width: 760px) { .dash { grid-template-columns: minmax(0, 1fr); } }
    .panel { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 14px; min-width: 0; }
    .panel figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .panel svg { display: block; max-width: 100%; }
    .tick text { fill: var(--muted); font-size: 11px; }
    .grid .tick line { stroke: var(--border); }
    .grid .domain { display: none; }
    .x .domain, .x .tick line { stroke: var(--muted); }
    .area { fill: var(--accent); fill-opacity: .14; }
    .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .rule { stroke: var(--muted); stroke-dasharray: 3 3; }
    .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
    .tip { fill: var(--fg); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
    .rule, .dot, .tip { pointer-events: none; }
    .brush .selection { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); }
    .row { cursor: pointer; outline: none; }
    .row text { font-size: 12.5px; fill: var(--fg); }
    .row .value { fill: var(--muted); }
    .row.off rect { fill-opacity: .2; }
    .row.off .label { fill: var(--muted); }
    .row:focus-visible rect { stroke: var(--fg); stroke-width: 2; }
    .summary { margin: 0; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body class="demo">
  <div class="dash">
    <figure id="trend-box" class="panel"><svg id="trend" role="img" aria-label="Orders per month in 2026 for the selected channels"></svg><figcaption>Orders per month · drag to select months</figcaption></figure>
    <figure class="panel side"><svg id="bars" width="300" height="150" viewBox="0 0 300 150" role="group" aria-label="Orders by channel"></svg><figcaption>Orders by channel · click to filter</figcaption></figure>
  </div>
  <p id="summary" class="summary" aria-live="polite"></p>
  <script src="../../assets/vendor/d3.min.js"></script>
  <script>
    const MONTHS = d3.range(12).map((i) => new Date(2026, i, 1));
    const SERIES = {
      Web: [120, 132, 148, 160, 155, 170, 182, 190, 176, 168, 195, 230],
      Store: [90, 85, 92, 98, 104, 110, 108, 112, 100, 96, 120, 160],
      Partner: [40, 44, 46, 50, 58, 62, 60, 65, 70, 72, 75, 90],
    };
    const COLORS = { Web: '#2563eb', Store: '#7c3aed', Partner: '#ea580c' };
    const fmt = d3.format(','), month = d3.timeFormat('%b');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // The whole dashboard is drawn from this state
    const state = { active: new Set(Object.keys(SERIES)), range: [0, 11] };
    const totals = () => MONTHS.map((date, i) => ({ date, value: d3.sum([...state.active], (k) => SERIES[k][i]) }));

    // ----- Trend: line, brush and hover -----
    const TH = 230, TM = { top: 16, right: 16, bottom: 26, left: 40 };
    const trend = d3.select('#trend');
    const gGrid = trend.append('g').attr('class', 'grid');
    const area = trend.append('path').attr('class', 'area');
    const line = trend.append('path').attr('class', 'line');
    const gX = trend.append('g').attr('class', 'x');
    const gBrush = trend.append('g').attr('class', 'brush');
    const rule = trend.append('line').attr('class', 'rule').style('display', 'none');
    const dot = trend.append('circle').attr('class', 'dot').attr('r', 4.5).style('display', 'none');
    const tip = trend.append('text').attr('class', 'tip').style('display', 'none');
    let x, y, brush;

    function drawTrend() {
      const W = document.getElementById('trend-box').clientWidth - 24, data = totals();
      x = d3.scaleTime().domain(d3.extent(MONTHS)).range([TM.left, W - TM.right]);
      y = d3.scaleLinear().domain([0, d3.max(data, (d) => d.value)]).nice().range([TH - TM.bottom, TM.top]);
      trend.attr('width', W).attr('height', TH).attr('viewBox', [0, 0, W, TH]);
      gGrid.attr('transform', `translate(${TM.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - TM.left - TM.right)));
      gX.attr('transform', `translate(0,${TH - TM.bottom})`).call(d3.axisBottom(x).ticks(d3.timeMonth.every(W < 520 ? 2 : 1)).tickFormat(month));
      area.attr('d', d3.area().x((d) => x(d.date)).y0(y(0)).y1((d) => y(d.value))(data));
      line.attr('d', d3.line().x((d) => x(d.date)).y((d) => y(d.value))(data));
      brush = d3.brushX().extent([[TM.left, TM.top], [W - TM.right, TH - TM.bottom]]).on('end', brushed);
      gBrush.call(brush);
      // Redraws move the brush back to the current selection; these calls have no sourceEvent
      const [i0, i1] = state.range;
      gBrush.call(brush.move, i0 === 0 && i1 === 11 ? null : [x(MONTHS[i0]), x(MONTHS[i1])]);
    }

    function brushed({ selection, sourceEvent }) {
      if (!sourceEvent) return;
      if (!selection) state.range = [0, 11];
      else {
        // Snap both edges to the nearest month
        const [i0, i1] = selection.map((px) => d3.bisector((d) => d).center(MONTHS, x.invert(px)));
        state.range = [i0, Math.max(i0, i1)];
      }
      update();
    }

    trend.on('pointermove', (event) => {
      const [mx] = d3.pointer(event), data = totals();
      const d = data[d3.bisector((p) => p.date).center(data, x.invert(mx))];
      const cx = x(d.date), cy = y(d.value), W = +trend.attr('width');
      rule.attr('x1', cx).attr('x2', cx).attr('y1', TM.top).attr('y2', TH - TM.bottom).style('display', null);
      dot.attr('cx', cx).attr('cy', cy).style('display', null);
      tip.attr('x', cx > W - 90 ? cx - 8 : cx + 8).attr('y', Math.max(cy - 10, TM.top + 10))
        .attr('text-anchor', cx > W - 90 ? 'end' : 'start').text(`${month(d.date)}: ${fmt(d.value)}`).style('display', null);
    }).on('pointerleave', () => { rule.style('display', 'none'); dot.style('display', 'none'); tip.style('display', 'none'); });

    // ----- Bars: one row per channel, each a toggle button -----
    const bars = d3.select('#bars');
    function toggle(key) {
      if (!state.active.has(key)) state.active.add(key);
      else if (state.active.size > 1) state.active.delete(key);
      update();
    }
    function drawBars() {
      const [i0, i1] = state.range;
      const rows = Object.keys(SERIES).map((key) => ({ key, value: d3.sum(SERIES[key].slice(i0, i1 + 1)) }));
      const xb = d3.scaleLinear().domain([0, d3.max(rows, (r) => r.value)]).range([0, 150]);
      const yb = d3.scaleBand().domain(rows.map((r) => r.key)).range([8, 142]).padding(0.28);
      const row = bars.selectAll('g.row').data(rows, (d) => d.key).join((enter) => {
        const g = enter.append('g').attr('class', 'row').attr('role', 'button').attr('tabindex', 0)
          .on('click', (e, d) => toggle(d.key))
          // A <g role="button"> gets no click from the keyboard, so handle Enter and Space here
          .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(d.key); } });
        g.append('text').attr('class', 'label').attr('x', 60).attr('text-anchor', 'end');
        g.append('rect').attr('x', 70).attr('rx', 3).attr('width', 0);
        g.append('text').attr('class', 'value').attr('x', 76);
        return g;
      });
      row.attr('transform', (d) => `translate(0,${yb(d.key)})`)
        .attr('aria-pressed', (d) => state.active.has(d.key))
        .attr('aria-label', (d) => `${d.key}: ${fmt(d.value)} orders`)
        .classed('off', (d) => !state.active.has(d.key));
      row.select('.label').attr('y', yb.bandwidth() / 2).attr('dominant-baseline', 'central').text((d) => d.key);
      row.select('.value').attr('y', yb.bandwidth() / 2).attr('dominant-baseline', 'central').text((d) => fmt(d.value))
        .transition().duration(reduce ? 0 : 300).attr('x', (d) => 76 + xb(d.value));
      row.select('rect').attr('height', yb.bandwidth()).attr('fill', (d) => COLORS[d.key])
        .transition().duration(reduce ? 0 : 300).attr('width', (d) => xb(d.value));
    }

    function update() {
      drawTrend();
      drawBars();
      const [i0, i1] = state.range, keys = [...state.active];
      const total = d3.sum(keys, (k) => d3.sum(SERIES[k].slice(i0, i1 + 1)));
      document.getElementById('summary').textContent = `${month(MONTHS[i0])}–${month(MONTHS[i1])} · ${keys.join(' + ')} · ${fmt(total)} orders`;
    }
    new ResizeObserver(() => drawTrend()).observe(document.getElementById('trend-box'));
    update();
  </script>
</body>
</html>
