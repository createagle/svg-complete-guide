<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>36-1 Roadmap Drawn on Scroll</title>
  <style>
    .note { margin: 0; font-size: 13px; color: var(--muted); }
    .scroller { width: 440px; max-width: 100%; height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 14px; scroll-timeline: --trip block; }
    .map { display: block; margin: 0 auto; }
    .track { fill: none; stroke: color-mix(in srgb, var(--fg) 15%, transparent); stroke-width: 10; stroke-linecap: round; }
    .route { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
    .stop circle { fill: var(--bg); stroke: var(--accent); stroke-width: 4; }
    .stop text { font: 600 20px system-ui, sans-serif; fill: var(--fg); }
    .me { display: none; fill: #e11d48; }
    /* Progressive enhancement: without scroll-driven animations the route is simply drawn in full */
    @supports (animation-timeline: scroll()) {
      @media (prefers-reduced-motion: no-preference) {
        .route { stroke-dasharray: 1 2; animation: draw linear both; animation-timeline: --trip; }
        .me { display: inline; offset-path: path("M200 60 C360 140 360 260 200 320 S40 520 200 620 S360 820 200 920 S40 1120 200 1220 S300 1380 200 1440"); animation: travel linear both; animation-timeline: --trip; }
        .stop { transform-box: fill-box; transform-origin: center; animation: pop ease-out both; animation-timeline: --trip; animation-range: calc(var(--at) - 4%) var(--at); }
      }
    }
    @keyframes draw { from { stroke-dashoffset: 1.01; } to { stroke-dashoffset: 0; } }
    @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="demo">
  <p id="support" class="note" role="status"></p>
  <div class="scroller" tabindex="0" aria-label="Scrollable roadmap">
    <svg class="map" width="400" height="1500" viewBox="0 0 400 1500" role="img" aria-label="A winding route with five milestones: Plan, Design, Build, Test and Launch">
      <path class="track" d="M200 60 C360 140 360 260 200 320 S40 520 200 620 S360 820 200 920 S40 1120 200 1220 S300 1380 200 1440"/>
      <path class="route" d="M200 60 C360 140 360 260 200 320 S40 520 200 620 S360 820 200 920 S40 1120 200 1220 S300 1380 200 1440" pathLength="1"/>
        <g class="stop" style="--at: 19.8%">
          <circle cx="200" cy="320" r="14"/>
          <text x="226" y="326" text-anchor="start">Plan</text>
        </g>
        <g class="stop" style="--at: 41.3%">
          <circle cx="200" cy="620" r="14"/>
          <text x="174" y="626" text-anchor="end">Design</text>
        </g>
        <g class="stop" style="--at: 62.5%">
          <circle cx="200" cy="920" r="14"/>
          <text x="226" y="926" text-anchor="start">Build</text>
        </g>
        <g class="stop" style="--at: 83.7%">
          <circle cx="200" cy="1220" r="14"/>
          <text x="174" y="1226" text-anchor="end">Test</text>
        </g>
        <g class="stop" style="--at: 100%">
          <circle cx="200" cy="1440" r="14"/>
          <text x="226" y="1446" text-anchor="start">Launch</text>
        </g>
      <circle class="me" r="8"/>
    </svg>
  </div>
  <script>
    // Only a status line; the animation itself is pure CSS
    const ok = CSS.supports('animation-timeline', 'scroll()');
    document.getElementById('support').textContent = ok ? 'Scroll-driven animations: supported — scroll the box' : 'Scroll-driven animations: not supported — showing the finished route';
  </script>
</body>
</html>
