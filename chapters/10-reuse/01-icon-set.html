<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>10-1 A Small Icon Set with symbol and use</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(3, 120px); gap: 16px; color: var(--icon-color); }
    .grid figure { margin: 0; padding: 16px 8px 10px; text-align: center; border: 1px solid var(--border); border-radius: 12px; }
    .grid .icon { width: var(--icon-size); height: var(--icon-size); display: block; margin: 0 auto; }
    .grid figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
    input { accent-color: var(--accent); }
    output { min-width: 3ch; color: var(--fg); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <!-- The sprite: symbols are defined once and never rendered by themselves -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <rect x="10" y="14" width="4" height="7" style="fill: var(--icon-accent, none)"/>
        <path d="M3 11 L12 3 L21 11"/>
        <path d="M5 10 V21 H19 V10"/>
      </g>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <circle cx="10.5" cy="10.5" r="6.5" style="fill: var(--icon-accent, none)"/>
        <path d="M15.5 15.5 L21 21"/>
      </g>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <path d="M12 20 C5 15 3 11.5 3 8.5 C3 5.5 5.5 3.5 8 3.5 C10 3.5 11.2 4.7 12 6 C12.8 4.7 14 3.5 16 3.5 C18.5 3.5 21 5.5 21 8.5 C21 11.5 19 15 12 20 Z" style="fill: var(--icon-accent, none)"/>
      </g>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <path d="M6 16 V11 A6 6 0 0 1 18 11 V16 L20 18 H4 Z" style="fill: var(--icon-accent, none)"/>
        <path d="M10 21 H14"/>
      </g>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <circle cx="12" cy="8" r="4" style="fill: var(--icon-accent, none)"/>
        <path d="M4 21 C4 16.5 7.5 14 12 14 C16.5 14 20 16.5 20 21"/>
      </g>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--icon-stroke, 2)">
        <polygon points="12,3 14.4,9.3 21,9.6 15.8,13.7 17.6,20.2 12,16.5 6.4,20.2 8.2,13.7 3,9.6 9.6,9.3" style="fill: var(--icon-accent, none)"/>
      </g>
    </symbol>
  </svg>

  <div class="controls">
    <label class="control">color <input id="color" type="color" value="#2563eb"></label>
    <label class="control"><input id="useAccent" type="checkbox" checked> --icon-accent <input id="accent" type="color" value="#fde68a"></label>
    <label class="control">--icon-stroke <input id="stroke" type="range" min="1" max="3" step=".25" value="2"><output for="stroke"></output></label>
    <label class="control">size <input id="size" type="range" min="24" max="72" step="4" value="48"><output for="size"></output></label>
  </div>
  <div class="stage">
    <div class="grid" id="grid">
      <figure><svg class="icon" role="img" aria-label="Home"><use href="#i-home"/></svg><figcaption>#i-home</figcaption></figure>
      <figure><svg class="icon" role="img" aria-label="Search"><use href="#i-search"/></svg><figcaption>#i-search</figcaption></figure>
      <figure><svg class="icon" role="img" aria-label="Favorite"><use href="#i-heart"/></svg><figcaption>#i-heart</figcaption></figure>
      <figure><svg class="icon" role="img" aria-label="Notifications"><use href="#i-bell"/></svg><figcaption>#i-bell</figcaption></figure>
      <figure><svg class="icon" role="img" aria-label="Profile"><use href="#i-user"/></svg><figcaption>#i-user</figcaption></figure>
      <figure><svg class="icon" role="img" aria-label="Starred"><use href="#i-star"/></svg><figcaption>#i-star</figcaption></figure>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function update() {
      const s = $('grid').style;
      s.setProperty('--icon-color', $('color').value);
      if ($('useAccent').checked) s.setProperty('--icon-accent', $('accent').value); else s.removeProperty('--icon-accent');
      s.setProperty('--icon-stroke', $('stroke').value);
      s.setProperty('--icon-size', $('size').value + 'px');
      document.querySelectorAll('output').forEach((o) => { o.value = $(o.htmlFor).value; });
    }
    document.querySelectorAll('input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
