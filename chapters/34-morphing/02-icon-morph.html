<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>34-2 Icon Morph with Three Engines</title>
  <script src="../../assets/vendor/flubber.min.js"></script>
  <script src="../../assets/vendor/gsap.min.js"></script>
  <script src="../../assets/vendor/MorphSVGPlugin.min.js"></script>
  <script src="../../assets/vendor/anime.umd.min.js"></script>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .control output { min-width: 2.6em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    input, select { accent-color: var(--accent); }
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    #shape { fill: var(--accent); }
    #icons .btn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Engine <select id="engine"><option value="flubber">flubber</option><option value="gsap">GSAP MorphSVG</option><option value="anime">Anime.js svg.morphTo</option></select></label>
  </div>
  <div class="controls" id="icons">
    <button class="btn" type="button" data-icon="play" aria-pressed="true">Play</button>
    <button class="btn" type="button" data-icon="heart" aria-pressed="false">Heart</button>
    <button class="btn" type="button" data-icon="star" aria-pressed="false">Star</button>
    <button class="btn" type="button" data-icon="circle" aria-pressed="false">Circle</button>
    <button class="btn" type="button" data-icon="bolt" aria-pressed="false">Bolt</button>
    <button class="btn" type="button" data-icon="drop" aria-pressed="false">Drop</button>
  </div>
  <div class="stage">
    <svg width="240" height="240" viewBox="0 0 24 24" role="img" aria-label="An icon that morphs into the chosen shape">
      <defs>
        <path id="icon-play" d="M7 4 L20 12 L7 20 Z"/>
        <path id="icon-heart" d="M12 20.5 C5 15.5 3 11.5 3 8.5 C3 5.5 5.5 3.5 8 3.5 C10 3.5 11.5 5 12 6.5 C12.5 5 14 3.5 16 3.5 C18.5 3.5 21 5.5 21 8.5 C21 11.5 19 15.5 12 20.5 Z"/>
        <path id="icon-star" d="M12.00 2.50 L14.47 9.10 L21.51 9.41 L15.99 13.80 L17.88 20.59 L12.00 16.70 L6.12 20.59 L8.01 13.80 L2.49 9.41 L9.53 9.10 Z"/>
        <path id="icon-circle" d="M12 3 A9 9 0 1 1 12 21 A9 9 0 1 1 12 3 Z"/>
        <path id="icon-bolt" d="M13 2 L4 14 H11 L10 22 L20 9 H13 Z"/>
        <path id="icon-drop" d="M12 2 C12 2 5 10 5 15 A7 7 0 0 0 19 15 C19 10 12 2 12 2 Z"/>
      </defs>
      <path id="shape" d="M7 4 L20 12 L7 20 Z"/>
    </svg>
  </div>
  <pre id="out" class="out"></pre>
  <script>
    const $ = (id) => document.getElementById(id), shape = $('shape');
    const CODE = {"flubber": "const interp = flubber.interpolate(shape.getAttribute('d'), target, { maxSegmentLength: 0.5 });\n// then, every frame: shape.setAttribute('d', interp(progress));", "gsap": "gsap.registerPlugin(MorphSVGPlugin);\ngsap.to(shape, { morphSVG: '#icon-heart', duration: 0.6, ease: 'power2.inOut' });", "anime": "const { animate, svg } = anime;\nanimate(shape, { d: svg.morphTo('#icon-heart'), duration: 600, ease: 'inOutQuad' });"};
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    gsap.registerPlugin(MorphSVGPlugin);
    let raf = 0, running = null;
    function morph(name) {
      const target = $('icon-' + name), engine = $('engine').value, ms = reduce.matches ? 0 : 600;
      cancelAnimationFrame(raf); gsap.killTweensOf(shape); if (running) running.pause();
      if (engine === 'flubber') {
        const interp = flubber.interpolate(shape.getAttribute('d'), target.getAttribute('d'), { maxSegmentLength: 0.5 });
        let start = null;
        const step = (now) => {
          if (start === null) start = now;
          const k = ms ? Math.min((now - start) / ms, 1) : 1, e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
          shape.setAttribute('d', interp(e));
          if (k < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      } else if (engine === 'gsap') {
        gsap.to(shape, { morphSVG: target, duration: ms / 1000, ease: 'power2.inOut' });
      } else {
        running = anime.animate(shape, { d: anime.svg.morphTo(target), duration: ms, ease: 'inOutQuad' });
      }
      document.querySelectorAll('#icons .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.icon === name));
      $('out').textContent = CODE[engine].replace(/icon-heart/g, 'icon-' + name);
    }
    document.querySelectorAll('#icons .btn').forEach((b) => b.addEventListener('click', () => morph(b.dataset.icon)));
    $('engine').addEventListener('input', () => { $('out').textContent = CODE[$('engine').value]; });
    $('out').textContent = CODE.flubber;
  </script>
</body>
</html>
