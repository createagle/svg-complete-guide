<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNG vs SVG zoom</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body class="demo">
  <label class="control">Zoom <input id="zoom" type="range" min="1" max="12" value="4"> <output id="zoom-out">4×</output></label>
  <div class="stage">
    <figure>
      <img class="zoomable" src="icon-32.png" alt="Icon as a 32×32 PNG" width="32" height="32">
      <figcaption>PNG · 32×32</figcaption>
    </figure>
    <figure>
      <img class="zoomable" src="icon.svg" alt="Icon as SVG" width="32" height="32">
      <figcaption>SVG</figcaption>
    </figure>
  </div>
  <script>
    const zoom = document.getElementById('zoom');
    const out = document.getElementById('zoom-out');
    const apply = () => {
      const size = 32 * zoom.value;
      document.querySelectorAll('.zoomable').forEach((img) => {
        img.style.width = img.style.height = size + 'px';
      });
      out.textContent = zoom.value + '×';
    };
    zoom.addEventListener('input', apply);
    apply();
  </script>
</body>
</html>
