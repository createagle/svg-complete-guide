<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 33-3 · Finished</title>
  <style>
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    .stage svg { color: var(--fg); }
  </style>
</head>
<body class="demo">
  <button id="run" class="btn" type="button">Run</button>
  <div class="stage">
  <svg width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="Three colored dots on separate lanes">
    <g stroke="currentColor" stroke-opacity=".2" stroke-dasharray="4 6"><line x1="30" y1="40" x2="390" y2="40"/><line x1="30" y1="90" x2="390" y2="90"/><line x1="30" y1="140" x2="390" y2="140"/></g>
    <circle class="dot" cx="30" cy="40" r="12" fill="#ef4444"/>
    <circle class="dot" cx="30" cy="90" r="12" fill="#f59e0b"/>
    <circle class="dot" cx="30" cy="140" r="12" fill="#22c55e"/>
  </svg>
  </div>
  <script>
    const dots = [...document.querySelectorAll('.dot')];
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const move = (dot) => dot.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(360px)' }], { duration: reduce.matches ? 0 : 600, easing: 'ease-in-out', fill: 'forwards' });
    document.getElementById('run').addEventListener('click', async () => {
      for (const dot of dots) await move(dot).finished;
    });
  </script>
</body>
</html>
