<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 28-3 · Finished</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="320" height="200" viewBox="0 0 320 200" role="img" aria-label="A green button with a glossy highlight near its top left">
    <defs>
      <filter id="gloss" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="height"/>
        <feSpecularLighting in="height" surfaceScale="4" specularConstant=".6" specularExponent="35" lighting-color="#ffffff" result="shine">
          <fePointLight x="110" y="30" z="220"/>
        </feSpecularLighting>
        <feComposite in="shine" in2="SourceAlpha" operator="in" result="shineInside"/>
        <feComposite in="SourceGraphic" in2="shineInside" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
      </filter>
    </defs>
    <rect width="320" height="200" rx="16" fill="#f1f5f9"/>
    <g filter="url(#gloss)">
      <rect x="70" y="66" width="180" height="68" rx="34" fill="#16a34a"/>
      <text x="160" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f0fdf4">PLAY</text>
    </g>
  </svg>
  </div>
</body>
</html>
