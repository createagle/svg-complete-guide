<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 32-2 · Starter</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="An orange fish moving along a wavy path tail first">
    <rect width="400" height="220" rx="16" fill="#e0f2fe"/>
    <path id="swim" d="M30 110 C90 40 150 180 210 110 S330 40 370 110" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 6"/>
    <g>
      <g>
        <ellipse rx="16" ry="9" fill="#f97316"/>
        <path d="M14 0 L26 -9 L26 9 Z" fill="#fb923c"/>
        <path d="M-4 -8 L4 -15 L8 -7 Z" fill="#ea580c"/>
        <circle cx="-8" cy="-2" r="2" fill="#0f172a"/>
      </g>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#swim"/>
      </animateMotion>
    </g>
  </svg>
  </div>
  <script>
    // SMIL ignores prefers-reduced-motion, so pause it from script
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('svg').pauseAnimations();
  </script>
</body>
</html>
