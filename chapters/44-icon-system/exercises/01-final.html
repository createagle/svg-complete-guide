<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 44-1 · Finished</title>
  <style>
    .bars { display: grid; gap: 12px; justify-items: center; }
    .bar { display: flex; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 12px; color: var(--accent); }
    .bar button { display: grid; place-items: center; padding: 8px; border: 0; border-radius: 8px; background: none; color: inherit; cursor: pointer; }
    .bar button:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
    /* One rule sizes and strokes every icon; a variant only changes the variables */
    .icon { width: var(--icon-size, 24px); height: var(--icon-size, 24px); stroke-width: var(--icon-stroke, 2); }
    .compact { --icon-size: 18px; --icon-stroke: 1.5; }
  </style>
</head>
<body class="demo">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="t-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol><symbol id="t-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol><symbol id="t-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol></svg>
  <div class="bars">
    <div class="bar" role="toolbar" aria-label="Toolbar"><button type="button" aria-label="Bell"><svg class="icon" aria-hidden="true"><use href="#t-bell"/></svg></button><button type="button" aria-label="Mail"><svg class="icon" aria-hidden="true"><use href="#t-mail"/></svg></button><button type="button" aria-label="Sliders"><svg class="icon" aria-hidden="true"><use href="#t-sliders"/></svg></button></div>
    <div class="bar compact" role="toolbar" aria-label="Compact toolbar"><button type="button" aria-label="Bell"><svg class="icon" aria-hidden="true"><use href="#t-bell"/></svg></button><button type="button" aria-label="Mail"><svg class="icon" aria-hidden="true"><use href="#t-mail"/></svg></button><button type="button" aria-label="Sliders"><svg class="icon" aria-hidden="true"><use href="#t-sliders"/></svg></button></div>
