<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>42-2 Content Security Policy vs an Injected Handler</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: min(560px, 100%); }
    .grid figure { margin: 0; display: grid; justify-items: center; gap: 6px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; }
    .grid iframe { width: 172px; height: 102px; border: 0; border-radius: 8px; background: #fff; }
    .grid figcaption { font: 600 13px ui-monospace, Menlo, Consolas, monospace; }
    .status { margin: 0; font-size: 13px; text-align: center; }
    .status.ran { color: #dc2626; font-weight: 600; }
    .status.safe { color: #16a34a; }
    #out { width: min(860px, 100%); white-space: pre-wrap; }
  </style>
</head>
<body class="demo">
  <div class="grid">
    <figure><iframe name="plain" sandbox="allow-scripts" title="No policy"></iframe><figcaption>No CSP</figcaption><p class="status" data-for="plain"></p></figure>
    <figure><iframe name="csp" sandbox="allow-scripts" title="With a nonce-based policy"></iframe><figcaption>script-src 'nonce-…'</figcaption><p class="status" data-for="csp"></p></figure>
  </div>
  <pre id="out" class="out" aria-label="Source of each frame"></pre>
  <script>
    const $ = (id) => document.getElementById(id);
    // The same unsanitized SVG (a harmless onerror payload) is inserted with innerHTML in both frames
    const SVG = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"160\" height=\"90\"><rect width=\"160\" height=\"90\" rx=\"8\" fill=\"#fde68a\"/><text x=\"80\" y=\"52\" text-anchor=\"middle\" font-family=\"sans-serif\">onerror<\/text><image href=\"data:image/png;base64,AAAA\" width=\"1\" height=\"1\" onerror=\"parent.postMessage(['ran','handler',name],'*')\"/><\/svg>";
    const NONCE = 'r4nd0m';
    const insert = (csp) => (csp ? '<meta http-equiv="Content-Security-Policy" content="script-src \'nonce-' + NONCE + '\'">' : '') +
      '<body style="margin:0"><div id="host"></div><script nonce="' + NONCE + '">' +
      // Report blocked handlers to the demo page as well
      'document.addEventListener("securitypolicyviolation", (e) => parent.postMessage(["blocked", e.violatedDirective], "*"));' +
      'document.getElementById("host").innerHTML = ' + JSON.stringify(SVG).replace(/</g, '\\u003c') + ';<\/script></body>';
    const frames = { plain: document.querySelector('iframe[name=plain]'), csp: document.querySelector('iframe[name=csp]') };
    for (const name in frames) {
      const st = document.querySelector('.status[data-for="' + name + '"]'); st.className = 'status safe'; st.textContent = 'Nothing ran';
      frames[name].srcdoc = insert(name === 'csp');
    }
    window.addEventListener('message', (e) => {
      const name = Object.keys(frames).find((n) => frames[n].contentWindow === e.source);
      if (!name || !Array.isArray(e.data)) return;
      const st = document.querySelector('.status[data-for="' + name + '"]');
      if (e.data[0] === 'ran') { st.className = 'status ran'; st.textContent = 'Payload ran'; }
      if (e.data[0] === 'blocked') { st.className = 'status safe'; st.textContent = 'Blocked by CSP (' + e.data[1] + ')'; }
    });
    $('out').textContent = 'Injected markup:\n' + SVG + '\n\nPolicy in the right frame:\n<meta http-equiv="Content-Security-Policy" content="script-src \'nonce-' + NONCE + '\'">';
  </script>
</body>
</html>
