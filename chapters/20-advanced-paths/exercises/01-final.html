<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 20-1 · Finished</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="360" height="140" viewBox="0 0 360 140" role="img" aria-label="Three stars with 5, 6 and 8 points">
    <path id="s5" fill="#f59e0b"/>
    <path id="s6" fill="#ef4444"/>
    <path id="s8" fill="#8b5cf6"/>
  </svg>
  </div>
  <script>
    function star(cx, cy, outer, inner, n) {
      const pts = [];
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
        const rad = i % 2 ? inner : outer;
        pts.push(`${(cx + Math.cos(a) * rad).toFixed(1)} ${(cy + Math.sin(a) * rad).toFixed(1)}`);
      }
      return 'M' + pts.join(' L') + ' Z';
    }
    document.getElementById('s5').setAttribute('d', star(60, 70, 50, 20, 5));
    document.getElementById('s6').setAttribute('d', star(180, 70, 50, 26, 6));
    document.getElementById('s8').setAttribute('d', star(300, 70, 50, 30, 8));
  </script>
</body>
</html>
