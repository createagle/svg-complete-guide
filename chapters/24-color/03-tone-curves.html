<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>24-3 feComponentTransfer Curves</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .control output { min-width: 2.6em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    input, select { accent-color: var(--accent); }
    .stage { align-items: center; }
    .plot { color: var(--muted); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">type
      <select id="type"><option>table</option><option>discrete</option><option>linear</option><option>gamma</option><option>identity</option></select>
    </label>
    <label class="control" data-for="table discrete">tableValues <input id="tv" type="text" value="0 0.2 1" size="14"></label>
    <label class="control" data-for="linear">slope <input id="slope" type="range" min="0" max="3" step="0.05" value="1.5"><output></output></label>
    <label class="control" data-for="linear">intercept <input id="intercept" type="range" min="-1" max="1" step="0.05" value="-0.25"><output></output></label>
    <label class="control" data-for="gamma">amplitude <input id="amplitude" type="range" min="0" max="2" step="0.05" value="1"><output></output></label>
    <label class="control" data-for="gamma">exponent <input id="exponent" type="range" min="0.1" max="4" step="0.05" value="2.2"><output></output></label>
    <label class="control" data-for="gamma">offset <input id="offset" type="range" min="-1" max="1" step="0.05" value="0"><output></output></label>
    <span class="control">Channels
      <label><input class="chan" type="checkbox" value="R" checked> R</label>
      <label><input class="chan" type="checkbox" value="G" checked> G</label>
      <label><input class="chan" type="checkbox" value="B" checked> B</label>
    </span>
  </div>
  <div class="stage">
    <svg class="plot" width="220" height="220" viewBox="-14 -6 120 120" role="img" aria-label="The transfer function: input on the horizontal axis, output on the vertical axis">
      <rect width="100" height="100" fill="none" stroke="currentColor" stroke-opacity=".25"/>
      <path d="M0 100 L100 0" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="2 2" fill="none"/>
      <path id="curve" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="50" y="112" text-anchor="middle" font-size="7" fill="currentColor">input</text>
      <text x="-6" y="50" text-anchor="middle" font-size="7" fill="currentColor" transform="rotate(-90 -6 50)">output</text>
    </svg>
    <svg width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Flat illustration of mountains, a sun, a tree and a river, with the curve applied">
      <defs>
        <filter id="curves" color-interpolation-filters="sRGB">
          <feComponentTransfer id="ct"></feComponentTransfer>
        </filter>
      </defs>
      <image href="photo.jpg" width="480" height="320" filter="url(#curves)"/>
    </svg>
  </div>
  <pre id="out" class="out"></pre>
  <script>
    const $ = (id) => document.getElementById(id);
    const clamp = (v) => Math.min(1, Math.max(0, v));
    // The transfer functions as defined in Filter Effects
    function fn(type, p) {
      const v = p.tv;
      if (type === 'table') return (C) => { const n = v.length - 1; if (n < 1) return C; const k = Math.min(n - 1, Math.floor(C * n)); return v[k] + (C - k / n) * n * (v[k + 1] - v[k]); };
      if (type === 'discrete') return (C) => { const n = v.length; if (!n) return C; return v[Math.min(n - 1, Math.floor(C * n))]; };
      if (type === 'linear') return (C) => p.slope * C + p.intercept;
      if (type === 'gamma') return (C) => p.amplitude * C ** p.exponent + p.offset;
      return (C) => C;
    }
    function update() {
      const type = $('type').value;
      document.querySelectorAll('[data-for]').forEach((el) => { el.hidden = !el.dataset.for.split(' ').includes(type); });
      document.querySelectorAll('input[type=range]').forEach((el) => { el.nextElementSibling.value = el.value; });
      const p = { tv: $('tv').value.trim().split(/[\s,]+/).filter(Boolean).map(Number).filter((n) => !isNaN(n)), slope: +$('slope').value, intercept: +$('intercept').value, amplitude: +$('amplitude').value, exponent: +$('exponent').value, offset: +$('offset').value };
      const attrs = { table: 'tableValues="' + p.tv.join(' ') + '"', discrete: 'tableValues="' + p.tv.join(' ') + '"', linear: 'slope="' + p.slope + '" intercept="' + p.intercept + '"', gamma: 'amplitude="' + p.amplitude + '" exponent="' + p.exponent + '" offset="' + p.offset + '"', identity: '' }[type];
      const chans = [...document.querySelectorAll('.chan:checked')].map((c) => c.value);
      const lines = chans.map((c) => '<feFunc' + c + ' type="' + type + '"' + (attrs ? ' ' + attrs : '') + '/>');
      $('ct').innerHTML = lines.join('');
      $('out').textContent = '<feComponentTransfer>\n' + lines.map((l) => '  ' + l).join('\n') + '\n</feComponentTransfer>';
      const f = fn(type, p);
      let d = '';
      for (let i = 0; i <= 200; i++) { const C = i / 200; d += (i ? 'L' : 'M') + (C * 100).toFixed(2) + ' ' + ((1 - clamp(f(C))) * 100).toFixed(2); }
      $('curve').setAttribute('d', d);
    }
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
