  <title>Exercise 31-1 · Finished</title>
  <style>
    .art { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .art > * { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: draw 1.2s ease-in-out forwards; }
    .art > :nth-child(2) { animation-delay: .6s; }
    .art > :nth-child(3) { animation-delay: .9s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
</head>
