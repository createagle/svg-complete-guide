<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 23-1 · Starter</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="320" height="200" viewBox="0 0 320 200" role="img" aria-label="A blue button with a blue drop shadow built from five primitives">
    <defs>
      <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
        <feOffset in="blur" dy="8" result="offset"/>
        <feFlood flood-color="#2563eb" flood-opacity=".45" result="color"/>
        <feComposite in="color" in2="offset" operator="in" result="shadow"/>
        <feMerge>
          <feMergeNode in="shadow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="320" height="200" rx="16" fill="#f1f5f9"/>
    <g filter="url(#shadow)">
      <rect x="90" y="74" width="140" height="48" rx="24" fill="#2563eb"/>
      <text x="160" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#fff">Subscribe</text>
    </g>
  </svg>
  </div>
</body>
</html>
