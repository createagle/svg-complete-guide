<!doctype html>
<html lang="en">
<head>

<body class="demo">
  <div class="stage">
  <svg width="360" height="160" viewBox="0 0 360 160" role="img" aria-label="Three thumbnails meant to be round; only part of the first one shows">
    <defs>
      <clipPath id="round">
        <circle cx="60" cy="60" r="60"/>
      </clipPath>
    </defs>
    <image href="../photo.jpg" x="10" y="20" width="120" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#round)"/>
    <image href="../photo.jpg" x="160" y="40" width="80" height="80" preserveAspectRatio="xMidYMid slice" clip-path="url(#round)"/>
    <image href="../photo.jpg" x="270" y="56" width="48" height="48" preserveAspectRatio="xMidYMid slice" clip-path="url(#round)"/>
  </svg>
  </div>
</body>
