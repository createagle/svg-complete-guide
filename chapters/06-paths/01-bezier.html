<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>6-1 Bézier Control Points</title>
  <style>
    .stage svg { width: 480px; touch-action: none; border: 1px solid var(--border); border-radius: 8px; }
    .curve { fill: none; stroke: var(--fg); stroke-width: 4; stroke-linecap: round; }
    .arm { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .end { fill: var(--fg); }
    .ctrl { fill: var(--bg); stroke: var(--accent); stroke-width: 3; }
    .handle { cursor: grab; }
    .handle:active { cursor: grabbing; }
    .handle text { fill: var(--muted); font: 12px system-ui, sans-serif; pointer-events: none; }
    figcaption code { font: 14px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); }
    select { accent-color: var(--accent); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Curve
      <select id="kind"><option value="C">Cubic · C</option><option value="Q">Quadratic · Q</option></select>
    </label>
  </div>
  <div class="stage">
    <figure>
      <svg id="pad" viewBox="0 0 400 300" role="img" aria-label="A curve with draggable end and control points">
        <line class="arm" id="arm1"/>
        <line class="arm" id="arm2"/>
        <path class="curve" id="curve"/>
        <g id="handles"></g>
      </svg>
      <figcaption><code id="d"></code></figcaption>
    </figure>
  </div>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const $ = (id) => document.getElementById(id);
    const pts = {
      p0: { x: 50, y: 240, kind: 'end' },
      c1: { x: 90, y: 50, kind: 'ctrl' },
      c2: { x: 310, y: 50, kind: 'ctrl' },
      q: { x: 200, y: 40, kind: 'ctrl' },
      p1: { x: 350, y: 240, kind: 'end' },
    };
    const set = (el, a) => { for (const k in a) el.setAttribute(k, a[k]); };
    for (const [name, p] of Object.entries(pts)) {
      const g = document.createElementNS(NS, 'g');
      g.classList.add('handle');
      g.dataset.name = name;
      const c = document.createElementNS(NS, 'circle');
      set(c, { r: 9, class: p.kind });
      const t = document.createElementNS(NS, 'text');
      t.textContent = { p0: 'start', p1: 'end', c1: 'control 1', c2: 'control 2', q: 'control' }[name];
      set(t, { x: 14, y: -12 });
      g.append(c, t);
      $('handles').append(g);
      p.el = g;
    }
    const f = (n) => Math.round(n);
    function draw() {
      const cubic = $('kind').value === 'C';
      const { p0, c1, c2, q, p1 } = pts;
      const a = cubic ? c1 : q, b = cubic ? c2 : q;
      const d = cubic
        ? `M${f(p0.x)} ${f(p0.y)} C${f(c1.x)} ${f(c1.y)} ${f(c2.x)} ${f(c2.y)} ${f(p1.x)} ${f(p1.y)}`
        : `M${f(p0.x)} ${f(p0.y)} Q${f(q.x)} ${f(q.y)} ${f(p1.x)} ${f(p1.y)}`;
      $('curve').setAttribute('d', d);
      $('d').textContent = `<path d="${d}"/>`;
      set($('arm1'), { x1: p0.x, y1: p0.y, x2: a.x, y2: a.y });
      set($('arm2'), { x1: p1.x, y1: p1.y, x2: b.x, y2: b.y });
      for (const [name, p] of Object.entries(pts)) {
        p.el.style.display = (name === 'q') === cubic ? 'none' : '';
        p.el.setAttribute('transform', `translate(${p.x} ${p.y})`);
      }
    }
    // Convert pointer position from screen pixels to SVG user units
    function toSvg(e) {
      const m = $('pad').getScreenCTM().inverse();
      const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
      return { x: Math.max(0, Math.min(400, pt.x)), y: Math.max(0, Math.min(300, pt.y)) };
    }
    let dragging = null;
    $('handles').addEventListener('pointerdown', (e) => {
      const g = e.target.closest('.handle');
      if (!g) return;
      dragging = pts[g.dataset.name];
      $('pad').setPointerCapture(e.pointerId);
    });
    $('pad').addEventListener('pointermove', (e) => {
      if (!dragging) return;
      Object.assign(dragging, toSvg(e));
      draw();
    });
    $('pad').addEventListener('pointerup', () => { dragging = null; });
    $('kind').addEventListener('input', draw);
    draw();
  </script>
</body>
</html>
