<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 33-1 · Finished</title>
  <style>
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    #blades { transform-box: fill-box; transform-origin: center; }
  </style>
</head>
<body class="demo">
  <button id="toggle" class="btn" type="button">Pause</button>
  <div class="stage">
  <svg width="240" height="240" viewBox="-80 -80 160 160" role="img" aria-label="A three-blade fan">
    <g id="blades" fill="var(--accent)">
      <path d="M0 -8 C10 -40 30 -60 44 -52 C52 -46 40 -24 0 -8 Z"/>
      <path d="M0 -8 C10 -40 30 -60 44 -52 C52 -46 40 -24 0 -8 Z" transform="rotate(120)"/>
      <path d="M0 -8 C10 -40 30 -60 44 -52 C52 -46 40 -24 0 -8 Z" transform="rotate(240)"/>
    </g>
    <circle r="10" fill="var(--fg)"/>
  </svg>
  </div>
  <script>
    const blades = document.getElementById('blades'), toggle = document.getElementById('toggle');
    const spin = blades.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 1200, iterations: Infinity });
    function sync() { toggle.textContent = spin.playState === 'running' ? 'Pause' : 'Play'; }
    toggle.addEventListener('click', () => { if (spin.playState === 'running') spin.pause(); else spin.play(); sync(); });
    // Reduced motion: start paused, the user can still press Play
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) spin.pause();
    sync();
  </script>
</body>
</html>
