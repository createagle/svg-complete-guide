<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>40-1 SVGO Playground</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    input, select { accent-color: var(--accent); }
    .control output { min-width: 1.4em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; width: min(980px, 100%); }
    #src { width: 100%; min-height: 300px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
    #out { min-height: 300px; white-space: pre-wrap; word-break: break-all; }
    .stage img { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Precision <input id="prec" type="range" min="0" max="5" value="3"><output></output></label>
    <label class="control"><input id="multipass" type="checkbox" checked> Multipass</label>
    <label class="control"><input id="styles" type="checkbox" checked> convertStyleToAttrs</label>
    <label class="control"><input id="dims" type="checkbox"> removeDimensions</label>
    <label class="control"><input id="a11y" type="checkbox" checked> Keep role and ARIA targets</label>
  </div>
  <div class="stage">
    <figure><img id="before" width="96" height="96" alt="Original drawing"><figcaption id="before-size"></figcaption></figure>
    <figure><img id="after" width="96" height="96" alt="Optimized drawing"><figcaption id="after-size"></figcaption></figure>
  </div>
  <div class="cols">
    <textarea id="src" spellcheck="false" aria-label="SVG input"></textarea>
    <pre id="out" class="out" aria-label="SVGO output"></pre>
  </div>
  <script src="../../assets/vendor/svgo.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    $('src').value = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<!-- Created with Inkscape (http://www.inkscape.org/) -->\n<svg\n   width=\"96\"\n   height=\"96\"\n   viewBox=\"0 0 96 96\"\n   version=\"1.1\"\n   id=\"svg8\"\n   role=\"img\"\n   aria-labelledby=\"weather-title\"\n   xmlns:inkscape=\"http://www.inkscape.org/namespaces/inkscape\"\n   xmlns:sodipodi=\"http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd\"\n   xmlns=\"http://www.w3.org/2000/svg\"\n   xmlns:svg=\"http://www.w3.org/2000/svg\">\n  <title id=\"weather-title\">Partly sunny</title>\n  <sodipodi:namedview id=\"namedview1\" pagecolor=\"#ffffff\" inkscape:zoom=\"4.000000\" />\n  <metadata id=\"metadata5\">exported 2026-03-14</metadata>\n  <defs id=\"defs2\" />\n  <g inkscape:label=\"Layer 1\" inkscape:groupmode=\"layer\" id=\"layer1\" transform=\"translate(0.000000,0.000000)\">\n    <circle style=\"fill:#fbbf24;fill-opacity:1;stroke:none;stroke-width:1.000000\" id=\"sun\" cx=\"34.000000\" cy=\"34.000000\" r=\"16.000000\" />\n    <path style=\"fill:#94a3b8;fill-opacity:1;fill-rule:nonzero;stroke:none\" d=\"M 28.000000,78.000000 C 18.058875,78.000000 10.000000,69.941125 10.000000,60.000000 C 10.000000,50.058875 18.058875,42.000000 28.000000,42.000000 C 30.123456,42.000000 32.161290,42.367920 34.054054,43.043478 C 38.000000,34.666667 46.400000,29.000000 56.000000,29.000000 C 69.254834,29.000000 80.000000,39.745166 80.000000,53.000000 C 80.000000,53.336842 79.993103,53.672131 79.979424,54.005737 C 84.700000,56.400000 88.000000,61.300000 88.000000,67.000000 C 88.000000,73.075132 83.075132,78.000000 77.000000,78.000000 Z\" id=\"cloud\" />\n    <g id=\"g20\" />\n  </g>\n</svg>\n";
    const enc = new TextEncoder();
    // gzip size with the browser's own CompressionStream
    async function gzipSize(text) {
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return (await new Response(stream).arrayBuffer()).byteLength;
    }
    const dataUrl = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    function config() {
      const overrides = {};
      if ($('a11y').checked) {
        // removeUnknownsAndDefaults drops role="img"; cleanupIds drops ids that only aria-* points to
        const ariaIds = [...$('src').value.matchAll(/aria-(?:labelledby|describedby)="([^"]*)"/g)].flatMap((m) => m[1].split(/\s+/));
        overrides.removeUnknownsAndDefaults = { keepRoleAttr: true };
        overrides.cleanupIds = { preserve: ariaIds };
      }
      const plugins = [{ name: 'preset-default', params: { overrides } }];
      if ($('styles').checked) plugins.push('convertStyleToAttrs');
      if ($('dims').checked) plugins.push('removeDimensions');
      return { multipass: $('multipass').checked, floatPrecision: +$('prec').value, plugins };
    }
    async function run() {
      $('prec').nextElementSibling.value = $('prec').value;
      const src = $('src').value;
      $('before').src = dataUrl(src);
      let result;
      try { result = SVGO.optimize(src, config()).data; }
      catch (e) { $('out').textContent = 'Error: ' + e.message; return; }
      $('after').src = dataUrl(result);
      $('out').textContent = result;
      const [a, b] = [enc.encode(src).length, enc.encode(result).length];
      const [ga, gb] = await Promise.all([gzipSize(src), gzipSize(result)]);
      $('before-size').textContent = 'Before: ' + a + ' B · gzip ' + ga + ' B';
      $('after-size').textContent = 'After: ' + b + ' B (−' + Math.round(100 - b / a * 100) + '%) · gzip ' + gb + ' B';
    }
    document.querySelectorAll('input, textarea').forEach((el) => el.addEventListener('input', run));
    run();
  </script>
</body>
</html>
