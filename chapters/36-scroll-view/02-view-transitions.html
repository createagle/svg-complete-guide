<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>36-2 View Transitions with SVG</title>
  <style>
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    input, select { accent-color: var(--accent); }
    .app { width: 480px; max-width: 100%; height: 340px; display: grid; place-items: center; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; cursor: pointer; }
    .detail { display: grid; justify-items: center; gap: 12px; }
    .detail h2 { margin: 0; font-size: 22px; }
    .icon { display: block; }
    ::view-transition-group(*) { animation-duration: calc(0.35s * var(--slow, 1)); }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Speed <select id="speed"><option value="1">normal</option><option value="5">5× slower</option></select></label>
    <span id="support" class="control"></span>
  </div>
  <main id="app" class="app">
    <div id="grid" class="grid">
      <button class="card" type="button" data-key="sun"><svg class="icon" width="56" height="56" viewBox="0 0 48 48" fill="#f59e0b" stroke="#f59e0b" style="view-transition-name: icon-sun" aria-hidden="true"><circle cx="24" cy="24" r="9"/><g stroke-width="3" stroke-linecap="round"><line x1="24" y1="4" x2="24" y2="9"/><line x1="24" y1="39" x2="24" y2="44"/><line x1="4" y1="24" x2="9" y2="24"/><line x1="39" y1="24" x2="44" y2="24"/><line x1="10" y1="10" x2="13.5" y2="13.5"/><line x1="34.5" y1="34.5" x2="38" y2="38"/><line x1="10" y1="38" x2="13.5" y2="34.5"/><line x1="34.5" y1="13.5" x2="38" y2="10"/></g></svg><span>Sunny</span></button>
      <button class="card" type="button" data-key="cloud"><svg class="icon" width="56" height="56" viewBox="0 0 48 48" fill="#64748b" stroke="#64748b" style="view-transition-name: icon-cloud" aria-hidden="true"><path d="M14 36 A8 8 0 0 1 14 20 A11 11 0 0 1 35 18 A9 9 0 0 1 36 36 Z"/></svg><span>Cloudy</span></button>
      <button class="card" type="button" data-key="rain"><svg class="icon" width="56" height="56" viewBox="0 0 48 48" fill="#2563eb" stroke="#2563eb" style="view-transition-name: icon-rain" aria-hidden="true"><path d="M14 28 A8 8 0 0 1 14 12 A11 11 0 0 1 35 10 A9 9 0 0 1 36 28 Z"/><g stroke-width="3" stroke-linecap="round"><line x1="16" y1="34" x2="13" y2="42"/><line x1="25" y1="34" x2="22" y2="42"/><line x1="34" y1="34" x2="31" y2="42"/></g></svg><span>Rainy</span></button>
      <button class="card" type="button" data-key="snow"><svg class="icon" width="56" height="56" viewBox="0 0 48 48" fill="#0891b2" stroke="#0891b2" style="view-transition-name: icon-snow" aria-hidden="true"><g stroke-width="3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="42"/><line x1="8.4" y1="15" x2="39.6" y2="33"/><line x1="8.4" y1="33" x2="39.6" y2="15"/></g><circle cx="24" cy="24" r="4"/></svg><span>Snowy</span></button>
    </div>
  </main>
  <script>
    const ICON = {"sun": "<svg class=\"icon\" width=\"200\" height=\"200\" viewBox=\"0 0 48 48\" fill=\"#f59e0b\" stroke=\"#f59e0b\" style=\"view-transition-name: icon-sun\" aria-hidden=\"true\"><circle cx=\"24\" cy=\"24\" r=\"9\"/><g stroke-width=\"3\" stroke-linecap=\"round\"><line x1=\"24\" y1=\"4\" x2=\"24\" y2=\"9\"/><line x1=\"24\" y1=\"39\" x2=\"24\" y2=\"44\"/><line x1=\"4\" y1=\"24\" x2=\"9\" y2=\"24\"/><line x1=\"39\" y1=\"24\" x2=\"44\" y2=\"24\"/><line x1=\"10\" y1=\"10\" x2=\"13.5\" y2=\"13.5\"/><line x1=\"34.5\" y1=\"34.5\" x2=\"38\" y2=\"38\"/><line x1=\"10\" y1=\"38\" x2=\"13.5\" y2=\"34.5\"/><line x1=\"34.5\" y1=\"13.5\" x2=\"38\" y2=\"10\"/></g></svg>", "cloud": "<svg class=\"icon\" width=\"200\" height=\"200\" viewBox=\"0 0 48 48\" fill=\"#64748b\" stroke=\"#64748b\" style=\"view-transition-name: icon-cloud\" aria-hidden=\"true\"><path d=\"M14 36 A8 8 0 0 1 14 20 A11 11 0 0 1 35 18 A9 9 0 0 1 36 36 Z\"/></svg>", "rain": "<svg class=\"icon\" width=\"200\" height=\"200\" viewBox=\"0 0 48 48\" fill=\"#2563eb\" stroke=\"#2563eb\" style=\"view-transition-name: icon-rain\" aria-hidden=\"true\"><path d=\"M14 28 A8 8 0 0 1 14 12 A11 11 0 0 1 35 10 A9 9 0 0 1 36 28 Z\"/><g stroke-width=\"3\" stroke-linecap=\"round\"><line x1=\"16\" y1=\"34\" x2=\"13\" y2=\"42\"/><line x1=\"25\" y1=\"34\" x2=\"22\" y2=\"42\"/><line x1=\"34\" y1=\"34\" x2=\"31\" y2=\"42\"/></g></svg>", "snow": "<svg class=\"icon\" width=\"200\" height=\"200\" viewBox=\"0 0 48 48\" fill=\"#0891b2\" stroke=\"#0891b2\" style=\"view-transition-name: icon-snow\" aria-hidden=\"true\"><g stroke-width=\"3\" stroke-linecap=\"round\"><line x1=\"24\" y1=\"6\" x2=\"24\" y2=\"42\"/><line x1=\"8.4\" y1=\"15\" x2=\"39.6\" y2=\"33\"/><line x1=\"8.4\" y1=\"33\" x2=\"39.6\" y2=\"15\"/></g><circle cx=\"24\" cy=\"24\" r=\"4\"/></svg>"};
    const LABEL = {"sun": "Sunny", "cloud": "Cloudy", "rain": "Rainy", "snow": "Snowy"};
    const app = document.getElementById('app'), grid = document.getElementById('grid').outerHTML;
    // Swap the DOM inside a view transition when the browser has one; otherwise swap it straight away
    function go(update) {
      if (!document.startViewTransition) return update();
      document.startViewTransition(update);
    }
    function showDetail(k) {
      app.innerHTML = '<div class="detail">' + ICON[k] + '<h2>' + LABEL[k] + '</h2><button class="btn" type="button" id="back">Back</button></div>';
      document.getElementById('back').focus();
    }
    function showGrid(k) {
      app.innerHTML = grid;
      app.querySelector('[data-key="' + k + '"]').focus();
    }
    app.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (card) return go(() => showDetail(card.dataset.key));
      if (e.target.id === 'back') { const k = app.querySelector('.icon').style.viewTransitionName.replace('icon-', ''); go(() => showGrid(k)); }
    });
    document.getElementById('speed').addEventListener('input', (e) => document.documentElement.style.setProperty('--slow', e.target.value));
    document.getElementById('support').textContent = document.startViewTransition ? 'View Transitions: supported' : 'View Transitions: not supported — instant swap';
  </script>
</body>
</html>
