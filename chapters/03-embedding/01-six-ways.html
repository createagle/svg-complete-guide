<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Six ways to put SVG on a page</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 16px; max-width: 560px; width: 100%; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 16px 8px 10px; text-align: center; color: #2563eb; }
    .card .art { width: 64px; height: 64px; margin: 0 auto 8px; display: block; }
    .card code { font-size: 12px; color: var(--muted); }
    .bg { background: url("icon.svg") center / contain no-repeat; }
    .masked { background-color: currentColor; mask: url("check-mask.svg") center / contain no-repeat; }

    /* Page CSS: what can it reach? */
    .themed .card { color: #ea580c; }
    .themed .card circle { fill: #ea580c; }
    @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control"><input type="checkbox" id="use-css"> Page CSS: make circles orange</label>
    <label class="control"><input type="checkbox" id="use-js"> JavaScript: make circles green</label>
  </div>
  <div class="grid">
    <div class="card"><img class="art" src="icon.svg" alt="Check icon"><code>&lt;img&gt;</code></div>
    <div class="card"><span class="art bg" role="img" aria-label="Check icon"></span><code>CSS background</code></div>
    <div class="card">
      <svg class="art" viewBox="0 0 32 32" role="img" aria-label="Check icon">
        <circle cx="16" cy="16" r="14" fill="#2563eb"/>
        <path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <code>inline &lt;svg&gt;</code>
    </div>
    <div class="card"><object class="art" id="obj" data="icon.svg" type="image/svg+xml" aria-label="Check icon"></object><code>&lt;object&gt;</code></div>
    <div class="card"><svg class="art" role="img" aria-label="Check icon"><use href="icons.svg#check"/></svg><code>&lt;use&gt; sprite</code></div>
    <div class="card"><span class="art masked" role="img" aria-label="Check icon"></span><code>mask-image</code></div>
  </div>
  <script>
    const css = document.getElementById('use-css');
    const js = document.getElementById('use-js');
    css.addEventListener('change', () => document.body.classList.toggle('themed', css.checked));

    // JavaScript can reach circles in the page and, same-origin, inside <object>.
    const circles = () => {
      const list = [...document.querySelectorAll('circle')];
      const doc = document.getElementById('obj').contentDocument;
      if (doc) list.push(...doc.querySelectorAll('circle'));
      return list;
    };
    js.addEventListener('change', () => {
      circles().forEach((c) => { c.style.fill = js.checked ? '#16a34a' : ''; });
    });
  </script>
</body>
</html>
