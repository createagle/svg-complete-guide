<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>13-2 A Themable Gradient Badge</title>
  <style>
    .theme-ocean  { --from: #38bdf8; --to: #1d4ed8; }
    .theme-sunset { --from: #fde047; --to: #e11d48; }
    .theme-forest { --from: #86efac; --to: #15803d; }
    .theme-mono   { --from: #e7e5e4; --to: #44403c; }
    .badge stop { transition: stop-color .4s ease; }
    .badge .rim { fill: var(--to); transition: fill .4s ease; }
    .badge .ribbon { fill: var(--to); opacity: .75; transition: fill .4s ease; }
    .badge text { fill: #fff; font: 800 44px/1 system-ui, sans-serif; letter-spacing: 2px; paint-order: stroke; stroke: rgb(0 0 0 / .18); stroke-width: 4px; }
    select, input { accent-color: var(--accent); }
    output { min-width: 4ch; color: var(--fg); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">theme
      <select id="theme"><option>ocean</option><option>sunset</option><option>forest</option><option>mono</option></select>
    </label>
    <label class="control">angle <input id="angle" type="range" min="0" max="180" step="15" value="90"><output for="angle"></output></label>
  </div>
  <div class="stage">
    <svg id="badge" class="badge theme-ocean" width="240" height="260" viewBox="0 0 240 260" role="img" aria-label="Pro badge">
      <defs>
        <linearGradient id="badge-fill" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(90 .5 .5)">
          <stop offset="0" style="stop-color: var(--from)"/>
          <stop offset="1" style="stop-color: var(--to)"/>
        </linearGradient>
        <radialGradient id="badge-shine" cx=".3" cy=".2" r=".7">
          <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path class="ribbon" d="M70 170 L50 250 L85 232 L105 255 L120 190 Z M170 170 L190 250 L155 232 L135 255 L120 190 Z"/>
      <path class="rim" d="M120 10 L205 59 V157 L120 206 L35 157 V59 Z"/>
      <path d="M120 22 L195 65 V151 L120 194 L45 151 V65 Z" fill="url(#badge-fill)"/>
      <path d="M120 22 L195 65 V151 L120 194 L45 151 V65 Z" fill="url(#badge-shine)"/>
      <text x="120" y="122" text-anchor="middle" dominant-baseline="central">PRO</text>
    </svg>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function update() {
      $('badge').setAttribute('class', 'badge theme-' + $('theme').value);
      $('badge-fill').setAttribute('gradientTransform', `rotate(${$('angle').value} .5 .5)`);
      document.querySelector('output').value = $('angle').value + '°';
    }
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
