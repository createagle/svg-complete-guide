<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <title>Sunset over green hills</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".45" stop-color="#db2777"/>
      <stop offset=".8" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset=".5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sky)"/>
  <circle cx="300" cy="200" r="90" fill="url(#sun)"/>
  <path d="M0 230 C80 180 160 190 240 220 S400 190 480 210 V320 H0 Z" fill="url(#far)"/>
  <path d="M0 270 C120 240 200 300 320 270 S440 250 480 262 V320 H0 Z" fill="url(#near)"/>
  <circle cx="90" cy="250" r="16" fill="#dc2626"/>
  <circle cx="122" cy="258" r="12" fill="#2563eb"/>
</svg>
