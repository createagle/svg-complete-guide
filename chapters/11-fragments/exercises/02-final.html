<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 11-2 · Finished</title>
</head>
<body class="demo">
  <div class="stage">
    <svg width="120" height="48" viewBox="0 0 120 48" role="img" aria-label="New">
      <defs>
        <linearGradient id="badge-new-grad" x2="0" y2="1">
          <stop offset="0" stop-color="#c084fc"/>
          <stop offset="1" stop-color="#7e22ce"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="112" height="40" rx="20" fill="url(#badge-new-grad)"/>
      <text x="60" y="24" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">NEW</text>
    </svg>
    <svg width="120" height="48" viewBox="0 0 120 48" role="img" aria-label="Done">
      <defs>
        <linearGradient id="badge-done-grad" x2="0" y2="1">
          <stop offset="0" stop-color="#86efac"/>
          <stop offset="1" stop-color="#15803d"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="112" height="40" rx="20" fill="url(#badge-done-grad)"/>
      <text x="60" y="24" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">DONE</text>
    </svg>
  </div>
</body>
</html>
