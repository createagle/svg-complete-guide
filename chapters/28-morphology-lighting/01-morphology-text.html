<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>28-1 Outlined Text with feMorphology</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .control output { min-width: 2.6em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    input, select { accent-color: var(--accent); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">Text <input id="text" type="text" value="Outline" maxlength="12" size="10"></label>
    <label class="control">operator <select id="op"><option>dilate</option><option>erode</option></select></label>
    <label class="control">radius <input id="r" type="range" min="0" max="10" step="0.5" value="4"><output id="rOut"></output></label>
    <label class="control">Style
      <select id="style"><option value="outline">Outline only</option><option value="stroke">Outline + fill</option><option value="raw">Morphology result</option></select>
    </label>
    <label class="control">Color <input id="ink" type="color" value="#f97316"></label>
  </div>
  <div class="stage">
    <svg width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="Large text with a morphology outline">
      <defs>
        <filter id="morph" x="-10%" y="-30%" width="120%" height="160%">
          <feMorphology id="fm" in="SourceAlpha" operator="dilate" radius="4" result="thick"/>
          <feFlood id="flood" flood-color="#f97316" result="ink"/>
          <feComposite in="ink" in2="thick" operator="in" result="grown"/>
          <feComposite id="cut" in="grown" in2="SourceAlpha" operator="out" result="ring"/>
          <feMerge id="merge"><feMergeNode in="ring"/></feMerge>
        </filter>
      </defs>
      <rect width="560" height="220" rx="16" fill="#1e293b"/>
      <text id="word" x="280" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="96" font-weight="800" fill="#f8fafc" filter="url(#morph)">Outline</text>
    </svg>
  </div>
  <pre id="out" class="out"></pre>
  <script>
    const $ = (id) => document.getElementById(id);
    // Each style is a different last step on top of the same "grown" shape
    const STYLES = {
      outline: { nodes: ['ring'], code: '<feComposite in="grown" in2="SourceAlpha" operator="out" result="ring"/>\n<feMerge><feMergeNode in="ring"/></feMerge>' },
      stroke: { nodes: ['grown', 'SourceGraphic'], code: '<feMerge><feMergeNode in="grown"/><feMergeNode in="SourceGraphic"/></feMerge>' },
      raw: { nodes: ['grown'], code: '<!-- the colored morphology result alone -->' },
    };
    function update() {
      const r = $('r').value, op = $('op').value, s = STYLES[$('style').value];
      $('fm').setAttribute('operator', op);
      $('fm').setAttribute('radius', r);
      $('flood').setAttribute('flood-color', $('ink').value);
      $('merge').innerHTML = s.nodes.map((n) => '<feMergeNode in="' + n + '"/>').join('');
      $('word').textContent = $('text').value || ' ';
      $('rOut').value = r;
      $('out').textContent = '<feMorphology in="SourceAlpha" operator="' + op + '" radius="' + r + '" result="thick"/>\n<feFlood flood-color="' + $('ink').value + '" result="ink"/>\n<feComposite in="ink" in2="thick" operator="in" result="grown"/>\n' + s.code;
    }
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
