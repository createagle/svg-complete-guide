<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recolor an inline SVG with CSS</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .icon { width: 96px; height: 96px; color: var(--brand, #2563eb); transition: color .2s; }
    .icon:hover { color: #16a34a; }
  </style>
</head>
<body class="demo">
  <label class="control">Color <input id="brand" type="color" value="#2563eb"></label>
  <div class="stage">
    <svg class="icon" viewBox="0 0 32 32" role="img" aria-label="Done">
      <circle cx="16" cy="16" r="14" fill="currentColor"/>
      <path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <script>
    const brand = document.getElementById('brand');
    brand.addEventListener('input', () => {
      document.body.style.setProperty('--brand', brand.value);
    });
  </script>
</body>
</html>
