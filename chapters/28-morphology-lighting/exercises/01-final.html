  <svg width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="The same text as a hollow light blue outline">

      <filter id="hollow" x="-10%" y="-20%" width="120%" height="140%">
        <feMorphology in="SourceGraphic" operator="dilate" radius="3" result="thick"/>

    <rect width="440" height="200" rx="16" fill="#0f172a"/>
    <text x="220" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="88" font-weight="800" fill="#38bdf8" filter="url(#hollow)">HELLO</text>
