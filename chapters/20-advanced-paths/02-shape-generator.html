<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>20-2 Polygon, Star and Blob Generator</title>
  <style>
    .guide { fill: none; stroke: var(--border); stroke-dasharray: 4 4; }
    #pts circle { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    button#shuffle { font: inherit; font-size: 14px; padding: 4px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; }
    .code { position: relative; width: min(560px, 100%); }
    .code pre { margin: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 8.5em; overflow-y: auto; }
    .code button { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
    select, input { accent-color: var(--accent); }
    output { min-width: 3ch; color: var(--fg); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">shape
      <select id="kind"><option>blob</option><option>star</option><option>polygon</option></select>
    </label>
    <label class="control">points <input id="n" type="range" min="3" max="12" step="1" value="7"><output for="n"></output></label>
    <label class="control">inner radius <input id="inner" type="range" min="20" max="90" step="5" value="45"><output for="inner"></output></label>
    <label class="control">randomness <input id="rand" type="range" min="0" max="45" step="5" value="25"><output for="rand"></output></label>
    <label class="control"><input id="smooth" type="checkbox" checked> smooth</label>
    <button id="shuffle" type="button">Shuffle</button>
  </div>
  <div class="stage">
    <svg width="300" height="300" viewBox="-150 -150 300 300" role="img" aria-label="A generated shape">
      <defs>
        <linearGradient id="blob-fill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a855f7"/>
          <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>
      </defs>
      <circle r="120" class="guide"/>
      <path id="shape" fill="url(#blob-fill)"/>
      <g id="pts"></g>
    </svg>
  </div>
  <div class="code">
    <pre id="code"></pre>
    <button id="copy" type="button">Copy</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const NS = 'http://www.w3.org/2000/svg';
    const r = (n) => +n.toFixed(1);
    let seed = 7;
    // Small seeded random generator, so the same seed always gives the same blob
    function rng(s) { return () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    function points(kind, n, inner, rand) {
      const R = 120, rnd = rng(seed), pts = [];
      const count = kind === 'star' ? n * 2 : n;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 - Math.PI / 2;
        let rad = kind === 'star' && i % 2 ? R * inner : R;
        if (kind === 'blob') rad = R * (1 - rand * rnd());
        pts.push([Math.cos(a) * rad, Math.sin(a) * rad]);
      }
      return pts;
    }
    const polygonD = (p) => 'M' + p.map(([x, y]) => `${r(x)} ${r(y)}`).join(' L') + ' Z';
    // Closed Catmull-Rom spline through every point, written as cubic Béziers
    function smoothD(p) {
      const n = p.length, at = (i) => p[(i + n) % n];
      let d = `M${r(p[0][0])} ${r(p[0][1])}`;
      for (let i = 0; i < n; i++) {
        const [x0, y0] = at(i - 1), [x1, y1] = at(i), [x2, y2] = at(i + 1), [x3, y3] = at(i + 2);
        d += ` C${r(x1 + (x2 - x0) / 6)} ${r(y1 + (y2 - y0) / 6)} ${r(x2 - (x3 - x1) / 6)} ${r(y2 - (y3 - y1) / 6)} ${r(x2)} ${r(y2)}`;
      }
      return d + ' Z';
    }
    function update() {
      const kind = $('kind').value, n = +$('n').value;
      const p = points(kind, n, $('inner').value / 100, $('rand').value / 100);
      const d = $('smooth').checked ? smoothD(p) : polygonD(p);
      $('shape').setAttribute('d', d);
      $('pts').replaceChildren(...p.map(([x, y]) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 3.5); return c; }));
      $('code').textContent = `<path d="${d}"/>`;
      $('inner').closest('label').hidden = kind !== 'star';
      $('rand').closest('label').hidden = kind !== 'blob';
      document.querySelectorAll('output').forEach((o) => { const id = o.getAttribute('for'); o.value = $(id).value + (id === 'n' ? '' : '%'); });
    }
    $('shuffle').addEventListener('click', () => { seed = Math.floor(Math.random() * 1e6); update(); });
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('code').textContent); $('copy').textContent = 'Copied'; }
      catch { $('copy').textContent = 'Select & copy'; }
      setTimeout(() => { $('copy').textContent = 'Copy'; }, 1200);
    });
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
