<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="dist/base.css">
  <link rel="stylesheet" href="dist/icons.css">
  <title>44-1 One Icon Set, Three Deliveries</title>
  <style>
    input, select { accent-color: var(--accent); }
    .control output { min-width: 2.6em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    .rows { display: grid; gap: 10px; width: min(760px, 100%); color: #2563eb; }
    .row { display: grid; grid-template-columns: 210px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; }
    .row code { font: 12.5px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); }
    .set { display: flex; gap: 14px; align-items: center; min-height: 48px; }
    .note { font-size: 12.5px; color: var(--muted); }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="demo">
  <!-- The sprite is inlined so the page also works when opened from disk -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol><symbol id="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol><symbol id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol><symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol><symbol id="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol><symbol id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8Z"/></symbol><symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z"/></symbol><symbol id="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol><symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol><symbol id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9Z"/></symbol><symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></symbol></svg>
  <div class="controls">
    <label class="control">Color <input id="color" type="color" value="#2563eb"></label>
    <label class="control">Size <input id="size" type="range" min="16" max="48" value="28"><output></output></label>
    <label class="control">Stroke <input id="stroke" type="range" min="1" max="3" step="0.25" value="2"><output></output></label>
  </div>
  <div id="rows" class="rows">
    <div class="row"><code>&lt;use href="#home"&gt;</code><div class="set"><svg class="icon" aria-hidden="true"><use href="#home"/></svg><svg class="icon" aria-hidden="true"><use href="#search"/></svg><svg class="icon" aria-hidden="true"><use href="#bell"/></svg><svg class="icon" aria-hidden="true"><use href="#heart"/></svg><svg class="icon" aria-hidden="true"><use href="#mail"/></svg><svg class="icon" aria-hidden="true"><use href="#sliders"/></svg></div><span class="note">color · size · stroke</span></div>
    <div class="row"><code>&lt;svg-icon name="home"&gt;</code><div class="set"><svg-icon name="home"></svg-icon><svg-icon name="search"></svg-icon><svg-icon name="bell"></svg-icon><svg-icon name="heart"></svg-icon><svg-icon name="mail"></svg-icon><svg-icon name="sliders"></svg-icon></div><span class="note">color · size · stroke</span></div>
    <div class="row"><code>class="i i-home"</code><div class="set"><span class="i i-home"></span><span class="i i-search"></span><span class="i i-bell"></span><span class="i i-heart"></span><span class="i i-mail"></span><span class="i i-sliders"></span></div><span class="note">color · size, stroke baked in</span></div>
  </div>
  <script src="dist/icons.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    // Three custom properties theme all three deliveries at once
    function apply() {
      const rows = $('rows');
      rows.style.color = $('color').value;
      rows.style.setProperty('--icon-size', $('size').value + 'px');
      rows.style.setProperty('--icon-stroke', $('stroke').value);
      $('size').nextElementSibling.value = $('size').value + 'px';
      $('stroke').nextElementSibling.value = $('stroke').value;
    }
    document.querySelectorAll('input').forEach((el) => el.addEventListener('input', apply));
    apply();
  </script>
</body>
</html>
