<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 34-2 · Finished</title>
  <script src="../../../assets/vendor/flubber.min.js"></script>
  <style>
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
  </style>
</head>
<body class="demo">
  <button id="morph" class="btn" type="button">Morph</button>
  <div class="stage">
  <svg width="240" height="240" viewBox="0 0 24 24" role="img" aria-label="A star that can morph into a circle">
    <path id="shape" d="M12.00 2.50 L14.47 9.10 L21.51 9.41 L15.99 13.80 L17.88 20.59 L12.00 16.70 L6.12 20.59 L8.01 13.80 L2.49 9.41 L9.53 9.10 Z" fill="var(--accent)"/>
  </svg>
  </div>
  <script>
    const shape = document.getElementById('shape');
    const STAR = 'M12.00 2.50 L14.47 9.10 L21.51 9.41 L15.99 13.80 L17.88 20.59 L12.00 16.70 L6.12 20.59 L8.01 13.80 L2.49 9.41 L9.53 9.10 Z';
    const CIRCLE = 'M12 3 A9 9 0 1 1 12 21 A9 9 0 1 1 12 3 Z';
    let toCircle = true, raf = 0;
    document.getElementById('morph').addEventListener('click', () => {
      cancelAnimationFrame(raf);
      const interp = flubber.interpolate(shape.getAttribute('d'), toCircle ? CIRCLE : STAR, { maxSegmentLength: 0.5 });
      toCircle = !toCircle;
      const ms = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700;
      let start = null;
      const step = (now) => {
        if (start === null) start = now;
        const t = ms ? Math.min((now - start) / ms, 1) : 1;
        shape.setAttribute('d', interp(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2));
        if (t < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    });
  </script>
</body>
</html>
