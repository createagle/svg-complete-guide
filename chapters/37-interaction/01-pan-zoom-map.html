<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>37-1 Draggable, Zoomable Map</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    input, select { accent-color: var(--accent); }
    .control output { min-width: 2.6em; font: 12px ui-monospace, Menlo, Consolas, monospace; }
    #map { touch-action: none; cursor: grab; border-radius: 12px; }
    #map.dragging { cursor: grabbing; }
    #map:focus-visible, .pin:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .region { stroke: #166534; stroke-width: 2; }
    .region.on { stroke: #e11d48; stroke-width: 5; }
    .pin { cursor: move; fill: #e11d48; }
    .pin text { font: 600 18px system-ui, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <button id="zin" class="btn" type="button" aria-label="Zoom in">+</button>
    <button id="zout" class="btn" type="button" aria-label="Zoom out">−</button>
    <button id="reset" class="btn" type="button">Reset</button>
  </div>
  <div class="stage">
    <svg id="map" width="560" height="378" viewBox="0 0 800 540" tabindex="0" role="application" aria-roledescription="map" aria-label="Map of an island. Drag or use the arrow keys to pan, scroll or press plus and minus to zoom">
      <rect x="-4000" y="-4000" width="8800" height="8540" fill="#7dd3fc"/>
      <g id="land">
        <path class="region" d="M120 70 C220 30 380 40 470 90 C430 150 330 190 230 180 C160 170 110 130 120 70 Z" fill="#86efac" data-name="North Hills"/>
        <path class="region" d="M470 90 C570 70 680 110 700 200 C690 290 610 330 520 300 C470 260 440 190 470 90 Z" fill="#fde68a" data-name="East Fields"/>
        <path class="region" d="M110 150 C170 180 250 200 300 260 C290 350 220 420 140 410 C80 380 60 280 110 150 Z" fill="#4ade80" data-name="West Forest"/>
        <path class="region" d="M300 260 C370 230 450 250 520 300 C560 380 500 460 400 470 C320 460 280 400 300 260 Z" fill="#bbf7d0" data-name="South Bay"/>
        <path d="M200 120 C260 200 330 240 420 330 C470 380 470 420 430 460" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
        <path d="M300 110 L420 400 M420 400 L600 210" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="8 6"/>
      </g>
      <g id="pins">
        <g class="pin" tabindex="0" role="button" aria-label="Pin Harbor. Drag, or use the arrow keys to move it" data-name="Harbor" transform="translate(420 400)">
          <path d="M0 0 C-4 -10 -14 -16 -14 -26 A14 14 0 1 1 14 -26 C14 -16 4 -10 0 0 Z"/>
          <circle cy="-26" r="5" fill="var(--bg)"/>
          <text y="-46" text-anchor="middle">Harbor</text>
        </g>
        <g class="pin" tabindex="0" role="button" aria-label="Pin Mill. Drag, or use the arrow keys to move it" data-name="Mill" transform="translate(600 210)">
          <path d="M0 0 C-4 -10 -14 -16 -14 -26 A14 14 0 1 1 14 -26 C14 -16 4 -10 0 0 Z"/>
          <circle cy="-26" r="5" fill="var(--bg)"/>
          <text y="-46" text-anchor="middle">Mill</text>
        </g>
        <g class="pin" tabindex="0" role="button" aria-label="Pin Lookout. Drag, or use the arrow keys to move it" data-name="Lookout" transform="translate(300 110)">
          <path d="M0 0 C-4 -10 -14 -16 -14 -26 A14 14 0 1 1 14 -26 C14 -16 4 -10 0 0 Z"/>
          <circle cy="-26" r="5" fill="var(--bg)"/>
          <text y="-46" text-anchor="middle">Lookout</text>
        </g>
      </g>
    </svg>
  </div>
  <pre id="out" class="out" role="status"></pre>
  <script>
    const $ = (id) => document.getElementById(id), map = $('map');
    const HOME = { x: 0, y: 0, w: 800, h: 540 };
    let vb = { ...HOME }, selected = '';
    const apply = () => map.setAttribute('viewBox', [vb.x, vb.y, vb.w, vb.h].map((v) => v.toFixed(1)).join(' '));
    // Screen → SVG user coordinates, through the current transform from the viewBox to the screen
    function toSVG(e) {
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(map.getScreenCTM().inverse());
      return { x: p.x, y: p.y };
    }
    function zoomAt(factor, cx, cy) {
      const w = Math.min(Math.max(vb.w * factor, 160), 1600);
      const k = w / vb.w;
      vb = { x: cx - (cx - vb.x) * k, y: cy - (cy - vb.y) * k, w, h: vb.h * k };
      apply(); report();
    }
    function report(p) {
      $('out').textContent = 'viewBox: ' + map.getAttribute('viewBox') + ' · zoom ' + (HOME.w / vb.w).toFixed(2) + '×' + (p ? '\npointer in map units: ' + p.x.toFixed(0) + ', ' + p.y.toFixed(0) : '') + (selected ? '\nselected region: ' + selected : '');
    }
    // Pointer: one pointer pans (or drags a pin), two pointers pinch-zoom
    const pointers = new Map();
    let drag = null, pinch = null;
    map.addEventListener('pointerdown', (e) => {
      pointers.set(e.pointerId, e);
      map.setPointerCapture(e.pointerId);
      const pin = e.target.closest('.pin');
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
        drag = null;
      } else if (pin) {
        const p = toSVG(e), t = pin.transform.baseVal.consolidate().matrix;
        drag = { pin, dx: p.x - t.e, dy: p.y - t.f };
      } else {
        drag = { x: e.clientX, y: e.clientY, moved: false };
        map.classList.add('dragging');
      }
    });
    map.addEventListener('pointermove', (e) => {
      report(toSVG(e));
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, e);
      if (pinch && pointers.size === 2) {
        const [a, b] = [...pointers.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const mid = toSVG({ clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2 });
        zoomAt(pinch.d / d, mid.x, mid.y); pinch.d = d;
      } else if (drag && drag.pin) {
        const p = toSVG(e);
        drag.pin.setAttribute('transform', 'translate(' + (p.x - drag.dx).toFixed(1) + ' ' + (p.y - drag.dy).toFixed(1) + ')');
      } else if (drag) {
        const s = vb.w / map.getBoundingClientRect().width;
        vb.x -= (e.clientX - drag.x) * s; vb.y -= (e.clientY - drag.y) * s;
        if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 0) drag.moved = true;
        drag.x = e.clientX; drag.y = e.clientY; apply();
      }
    });
    function end(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      // A press that did not move is a click: select the region under the pointer
      if (drag && !drag.pin && !drag.moved && e.type === 'pointerup') {
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        document.querySelectorAll('.region').forEach((r) => r.classList.toggle('on', r === hit));
        selected = hit && hit.classList.contains('region') ? hit.dataset.name : '';
        report(toSVG(e));
      }
      if (!pointers.size) { drag = null; map.classList.remove('dragging'); }
    }
    map.addEventListener('pointerup', end);
    map.addEventListener('pointercancel', end);
    map.addEventListener('wheel', (e) => { e.preventDefault(); const p = toSVG(e); zoomAt(Math.exp(e.deltaY * 0.0015), p.x, p.y); }, { passive: false });
    // Keyboard: arrows pan the map, or move the focused pin; + and - zoom around the center
    map.addEventListener('keydown', (e) => {
      const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      const pin = e.target.closest('.pin');
      if (step && pin) {
        const t = pin.transform.baseVal.consolidate().matrix;
        pin.setAttribute('transform', 'translate(' + (t.e + step[0] * 10) + ' ' + (t.f + step[1] * 10) + ')');
      } else if (step) { vb.x += step[0] * vb.w * 0.08; vb.y += step[1] * vb.h * 0.08; apply(); }
      else if (e.key === '+' || e.key === '=') zoomAt(0.8, vb.x + vb.w / 2, vb.y + vb.h / 2);
      else if (e.key === '-') zoomAt(1.25, vb.x + vb.w / 2, vb.y + vb.h / 2);
      else if (e.key === '0') { vb = { ...HOME }; apply(); }
      else return;
      e.preventDefault(); report();
    });
    $('zin').addEventListener('click', () => zoomAt(0.8, vb.x + vb.w / 2, vb.y + vb.h / 2));
    $('zout').addEventListener('click', () => zoomAt(1.25, vb.x + vb.w / 2, vb.y + vb.h / 2));
    $('reset').addEventListener('click', () => { vb = { ...HOME }; apply(); report(); });
    report();
  </script>
</body>
</html>
