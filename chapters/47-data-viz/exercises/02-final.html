<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 47-2 · Finished</title>
  <style>
    .box { width: min(640px, 100%); }
    #chart { display: block; overflow: visible; }
    #chart .tick text { fill: var(--muted); font-size: 11px; }
    #chart .domain, #chart .tick line { stroke: var(--muted); }
    #chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  </style>
</head>
<body class="demo">
  <div id="box" class="box"><svg id="chart" role="img" aria-label="Weekly sign-ups, first half of 2026"><g class="x-axis"></g><g class="y-axis"></g><path class="line"></path></svg></div>
  <script src="../../../assets/vendor/d3.min.js"></script>
  <script>
    const data = Array.from({ length: 26 }, (_, i) => ({ date: new Date(2026, 0, 5 + i * 7), value: 120 + Math.round(40 * Math.sin(i / 4) + i * 3) }));
    const W = document.getElementById('box').clientWidth, H = 260, M = { top: 12, right: 16, bottom: 28, left: 40 };
    // A time scale knows about calendars, so its ticks fall on months and read as dates
    const x = d3.scaleTime().domain(d3.extent(data, (d) => d.date)).range([M.left, W - M.right]);
    const y = d3.scaleLinear().domain([0, d3.max(data, (d) => d.value)]).nice().range([H - M.bottom, M.top]);
    const svg = d3.select('#chart').attr('width', W).attr('height', H).attr('viewBox', [0, 0, W, H]);
    svg.select('.x-axis').attr('transform', `translate(0,${H - M.bottom})`).call(d3.axisBottom(x).ticks(W / 100));
    svg.select('.y-axis').attr('transform', `translate(${M.left},0)`).call(d3.axisLeft(y).ticks(5));
    svg.select('.line').attr('d', d3.line().x((d) => x(d.date)).y((d) => y(d.value))(data));
  </script>
</body>
</html>
