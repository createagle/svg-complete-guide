<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>31-2 Icon Micro-interactions</title>
  <style>
    .out { margin: 0; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 8px 12px; max-width: 100%; overflow-x: auto; white-space: pre; }
    .icon { padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg); color: var(--fg); cursor: pointer; line-height: 0; }
    .icon svg { overflow: visible; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .menu line { transition: transform .3s, opacity .2s; transform-box: fill-box; transform-origin: center; }
    .menu[aria-expanded="true"] .top { transform: translateY(6px) rotate(45deg); }
    .menu[aria-expanded="true"] .mid { opacity: 0; }
    .menu[aria-expanded="true"] .bot { transform: translateY(-6px) rotate(-45deg); }
    .check circle { transition: fill .3s, stroke .3s; }
    .check .tick { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .35s ease .1s; }
    .check[aria-pressed="true"] circle { fill: #16a34a; stroke: #16a34a; }
    .check[aria-pressed="true"] .tick { stroke: #fff; stroke-dashoffset: 0; }
    .heart path { transition: fill .2s, stroke .2s; transform-box: fill-box; transform-origin: center; }
    .heart[aria-pressed="true"] path { fill: #e11d48; stroke: #e11d48; animation: pop .4s ease-out; }
    @keyframes pop { 50% { transform: scale(1.3); } }
    .bell .body { transform-box: fill-box; transform-origin: 50% 0; }
    .bell[aria-pressed="true"] .body { animation: ring .6s ease-in-out; }
    .bell[aria-pressed="true"] path { fill: currentColor; }
    @keyframes ring { 20% { transform: rotate(15deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
    .pp path { fill: currentColor; transition: d .3s; }
    .pp[aria-pressed="true"] path { d: path("M6 5 L10 5 L10 19 L6 19 Z M14 5 L18 5 L18 19 L14 19 Z"); }
    /* Safari has no CSS d property: script swaps the attribute instead (no tween) */
  </style>
</head>
<body class="demo">
  <div class="stage">
    <figure>
      <button class="icon menu" type="button" aria-label="Menu" aria-expanded="false">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
          <line class="top" x1="4" y1="6" x2="20" y2="6"/>
          <line class="mid" x1="4" y1="12" x2="20" y2="12"/>
          <line class="bot" x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>
      <figcaption>Menu</figcaption>
    </figure>
    <figure>
      <button class="icon check" type="button" aria-label="Done" aria-pressed="false">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path class="tick" d="M7.5 12.5 L10.5 15.5 L16.5 9" pathLength="1"/>
        </svg>
      </button>
      <figcaption>Done</figcaption>
    </figure>
    <figure>
      <button class="icon heart" type="button" aria-label="Like" aria-pressed="false">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20.5 C5 15.5 3 11.5 3 8.5 C3 5.5 5.5 3.5 8 3.5 C10 3.5 11.5 5 12 6.5 C12.5 5 14 3.5 16 3.5 C18.5 3.5 21 5.5 21 8.5 C21 11.5 19 15.5 12 20.5 Z"/>
        </svg>
      </button>
      <figcaption>Like</figcaption>
    </figure>
    <figure>
      <button class="icon bell" type="button" aria-label="Notifications" aria-pressed="false">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
          <g class="body">
            <path d="M6 17 V11 A6 6 0 0 1 18 11 V17 L19.5 19 H4.5 Z"/>
            <path d="M10 21.5 A2 2 0 0 0 14 21.5"/>
          </g>
        </svg>
      </button>
      <figcaption>Notifications</figcaption>
    </figure>
    <figure>
      <button class="icon pp" type="button" aria-label="Play" aria-pressed="false">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 5 L12 8 L12 16 L7 19 Z M12 8 L18 12 L18 12 L12 16 Z"/>
        </svg>
      </button>
      <figcaption>Play</figcaption>
    </figure>
  </div>
  <pre id="out" class="out"></pre>
  <script>
    const CSS_CODE = {"menu": ".menu line { transition: transform .3s, opacity .2s; transform-box: fill-box; transform-origin: center; }\n.menu[aria-expanded=\"true\"] .top { transform: translateY(6px) rotate(45deg); }\n.menu[aria-expanded=\"true\"] .mid { opacity: 0; }\n.menu[aria-expanded=\"true\"] .bot { transform: translateY(-6px) rotate(-45deg); }", "check": ".check circle { transition: fill .3s, stroke .3s; }\n.check .tick { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .35s ease .1s; }\n.check[aria-pressed=\"true\"] circle { fill: #16a34a; stroke: #16a34a; }\n.check[aria-pressed=\"true\"] .tick { stroke: #fff; stroke-dashoffset: 0; }", "heart": ".heart path { transition: fill .2s, stroke .2s; transform-box: fill-box; transform-origin: center; }\n.heart[aria-pressed=\"true\"] path { fill: #e11d48; stroke: #e11d48; animation: pop .4s ease-out; }\n@keyframes pop { 50% { transform: scale(1.3); } }", "bell": ".bell .body { transform-box: fill-box; transform-origin: 50% 0; }\n.bell[aria-pressed=\"true\"] .body { animation: ring .6s ease-in-out; }\n.bell[aria-pressed=\"true\"] path { fill: currentColor; }\n@keyframes ring { 20% { transform: rotate(15deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }", "pp": ".pp path { fill: currentColor; transition: d .3s; }\n.pp[aria-pressed=\"true\"] path { d: path(\"M6 5 L10 5 L10 19 L6 19 Z M14 5 L18 5 L18 19 L14 19 Z\"); }\n/* Safari has no CSS d property: script swaps the attribute instead (no tween) */"};
    const PAUSE_D = 'M6 5 L10 5 L10 19 L6 19 Z M14 5 L18 5 L18 19 L14 19 Z', PLAY_D = 'M7 5 L12 8 L12 16 L7 19 Z M12 8 L18 12 L18 12 L12 16 Z';
    const hasCssD = CSS.supports('d', 'path("M0 0")');
    const out = document.getElementById('out');
    document.querySelectorAll('.icon').forEach((b) => b.addEventListener('click', () => {
      const attr = b.hasAttribute('aria-expanded') ? 'aria-expanded' : 'aria-pressed';
      const on = b.getAttribute(attr) !== 'true';
      b.setAttribute(attr, on);
      if (b.classList.contains('pp')) {
        b.setAttribute('aria-label', on ? 'Pause' : 'Play');
        if (!hasCssD) b.querySelector('path').setAttribute('d', on ? PAUSE_D : PLAY_D);
      }
      out.textContent = CSS_CODE[b.classList[1]];
    }));
    out.textContent = CSS_CODE.menu;
  </script>
</body>
</html>
