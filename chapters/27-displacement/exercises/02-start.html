<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 27-2 · Starter</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="A blue ticket shifted down and to the right of its dashed outline">
    <defs>
      <filter id="ripple" x="0" y="0" width="100%" height="100%">
        <feFlood flood-color="#808080" result="neutral"/>
        <feDisplacementMap in="SourceGraphic" in2="neutral" scale="60" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <rect width="360" height="240" rx="16" fill="#e0f2fe"/>
    <g filter="url(#ripple)">
      <rect x="60" y="50" width="240" height="140" rx="12" fill="#0ea5e9"/>
      <text x="180" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#fff">ADMIT ONE</text>
    </g>
    <rect x="60" y="50" width="240" height="140" rx="12" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 5"/>
  </svg>
  </div>
</body>
</html>
