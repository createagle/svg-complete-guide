<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    #arc { transform-origin: 24px 24px; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <circle cx="24" cy="24" r="18" fill="none" stroke="#3b82f6" stroke-opacity=".25" stroke-width="5"/>
  <circle id="arc" cx="24" cy="24" r="18" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 200"/>
</svg>
