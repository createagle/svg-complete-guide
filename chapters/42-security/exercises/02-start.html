<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 42-2 · Starter</title>
  <style>
    .tags { display: flex; gap: 10px; }
    .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid currentColor; font-size: 15px; }
    .tag .icon { width: 20px; height: 20px; }
    .tag .icon svg { width: 100%; height: 100%; display: block; }
    .a { color: #2563eb; } .b { color: #db2777; } .c { color: #16a34a; }
    #status { margin: 0; font-size: 14px; color: #16a34a; }
    #status.ran { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body class="demo">
  <div class="tags">
    <span class="tag a"><span class="icon"></span> Starred</span>
    <span class="tag b"><span class="icon"></span> Starred</span>
    <span class="tag c"><span class="icon"></span> Starred</span>
  </div>
  <p id="status">No script ran</p>
  <script>
    // A user-supplied icon that must follow each tag’s text color, so it has to be inline
    const uploaded = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7Z\"/><image href=\"data:image/png;base64,AAAA\" width=\"1\" height=\"1\" onerror=\"document.getElementById('status').textContent='Payload ran'\"/><\/svg>";
    // Turn the status red if the payload rewrote it
    new MutationObserver(() => document.getElementById('status').classList.toggle('ran', /Payload/.test(document.getElementById('status').textContent))).observe(document.getElementById('status'), { childList: true });
    document.querySelectorAll('.icon').forEach((el) => { el.innerHTML = uploaded; });
  </script>
</body>
</html>
