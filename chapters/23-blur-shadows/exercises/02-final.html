<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 23-2 · Finished</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="320" height="220" viewBox="0 0 320 220" role="img" aria-label="A card with a tight contact shadow and a soft ambient shadow">
    <defs>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity=".25" result="contact"/>
        <feDropShadow in="SourceGraphic" dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity=".18" result="ambient"/>
        <feMerge>
          <feMergeNode in="ambient"/>
          <feMergeNode in="contact"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="320" height="220" rx="16" fill="#f1f5f9"/>
    <g filter="url(#shadow)">
      <rect x="70" y="44" width="180" height="116" rx="14" fill="#fff"/>
      <circle cx="108" cy="84" r="20" fill="#f59e0b"/>
      <rect x="138" y="74" width="88" height="9" rx="4.5" fill="#a8a29e"/>
      <rect x="138" y="90" width="58" height="9" rx="4.5" fill="#d6d3d1"/>
      <rect x="92" y="124" width="136" height="14" rx="7" fill="#2563eb"/>
    </g>
  </svg>
  </div>
</body>
</html>
