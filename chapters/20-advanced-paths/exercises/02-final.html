<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 20-2 · Finished</title>
</head>
<body class="demo">
  <div class="stage">
  <svg width="360" height="140" viewBox="0 0 360 140" role="img" aria-label="Pie charts at 25, 60 and 85 percent">
    <g fill="#e7e5e4"><circle cx="60" cy="70" r="50"/><circle cx="180" cy="70" r="50"/><circle cx="300" cy="70" r="50"/></g>
    <g fill="#2563eb"><path id="p25"/><path id="p60"/><path id="p85"/></g>
  </svg>
  </div>
  <script>
    // A slice from 12 o'clock, clockwise, covering the fraction pct of the circle
    function slice(cx, cy, r, pct) {
      const a = pct * Math.PI * 2 - Math.PI / 2;
      const x = (cx + Math.cos(a) * r).toFixed(2), y = (cy + Math.sin(a) * r).toFixed(2);
      const large = pct > 0.5 ? 1 : 0;
      return `M${cx} ${cy} V${cy - r} A${r} ${r} 0 ${large} 1 ${x} ${y} Z`;
    }
    document.getElementById('p25').setAttribute('d', slice(60, 70, 50, 0.25));
    document.getElementById('p60').setAttribute('d', slice(180, 70, 50, 0.6));
    document.getElementById('p85').setAttribute('d', slice(300, 70, 50, 0.85));
  </script>
</body>
</html>
