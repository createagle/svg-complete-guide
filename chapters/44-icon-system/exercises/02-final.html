<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 44-2 · Finished</title>
  <style>
    .actions { display: flex; gap: 10px; }
    .actions button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
    .actions button:hover, .actions button:focus-visible { color: #db2777; border-color: currentColor; }

    /* The icon is a mask; whatever color the text has, the icon has */
    .i { display: inline-block; width: 20px; height: 20px; background-color: currentColor; mask: var(--i) no-repeat center / contain; }
    .i-heart { --i: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20.8%204.6a5.5%205.5%200%200%200-7.8%200L12%205.7l-1-1.1a5.5%205.5%200%200%200-7.8%207.8L12%2021.2l8.8-8.8a5.5%205.5%200%200%200%200-7.8Z%22/%3E%3C/svg%3E"); }
    .i-star { --i: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m12%202.5%202.9%206%206.6.9-4.8%204.6%201.2%206.5L12%2017.4l-5.9%203.1%201.2-6.5-4.8-4.6%206.6-.9Z%22/%3E%3C/svg%3E"); }
    .i-download { --i: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%204v11m-5-5%205%205%205-5M5%2020h14%22/%3E%3C/svg%3E"); }
  </style>
</head>
<body class="demo">
  <div class="actions">
    <button type="button"><span class="i i-heart" aria-hidden="true"></span> Like</button>
    <button type="button"><span class="i i-star" aria-hidden="true"></span> Save</button>
    <button type="button"><span class="i i-download" aria-hidden="true"></span> Download</button>
  </div>
</body>
</html>
