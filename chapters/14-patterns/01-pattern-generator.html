<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>14-1 Geometric Pattern Generator</title>
  <style>
    .code { position: relative; width: min(520px, 100%); }
    .code pre { margin: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; min-height: 7.5em; }
    .code button { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
    select, input { accent-color: var(--accent); }
    output { min-width: 3ch; color: var(--fg); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <label class="control">motif
      <select id="motif"><option>dots</option><option>grid</option><option>stripes</option><option>checker</option><option>zigzag</option><option>plus</option></select>
    </label>
    <label class="control">size <input id="size" type="range" min="8" max="48" step="2" value="24"><output for="size"></output></label>
    <label class="control">rotate <input id="rot" type="range" min="0" max="90" step="5" value="0"><output for="rot"></output></label>
    <label class="control">ink <input id="ink" type="color" value="#2563eb"></label>
    <label class="control">paper <input id="paper" type="color" value="#dbeafe"></label>
  </div>
  <div class="stage">
    <svg width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="A rectangle filled with a repeating pattern">
      <defs><pattern id="tile" patternUnits="userSpaceOnUse"></pattern></defs>
      <rect width="520" height="260" rx="16" fill="url(#tile)"/>
    </svg>
  </div>
  <div class="code">
    <pre id="code"></pre>
    <button id="copy" type="button">Copy</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    // Each motif returns the tile content for a tile of size s
    const motifs = {
      dots: (s, ink) => `<circle cx="${s / 2}" cy="${s / 2}" r="${(s * .18).toFixed(1)}" fill="${ink}"/>`,
      grid: (s, ink) => `<path d="M${s} 0V${s}H0" fill="none" stroke="${ink}" stroke-width="2"/>`,
      stripes: (s, ink) => `<rect width="${s / 2}" height="${s}" fill="${ink}"/>`,
      checker: (s, ink) => `<path d="M0 0H${s / 2}V${s / 2}H0Z M${s / 2} ${s / 2}H${s}V${s}H${s / 2}Z" fill="${ink}"/>`,
      zigzag: (s, ink) => `<path d="M0 ${s * .75}L${s / 2} ${s * .25}L${s} ${s * .75}" fill="none" stroke="${ink}" stroke-width="${(s / 8).toFixed(1)}" stroke-linecap="square"/>`,
      plus: (s, ink) => `<path d="M${s / 2} ${s * .3}V${s * .7}M${s * .3} ${s / 2}H${s * .7}" stroke="${ink}" stroke-width="${(s / 10).toFixed(1)}" stroke-linecap="round"/>`,
    };
    function update() {
      const s = +$('size').value, r = +$('rot').value, ink = $('ink').value, paper = $('paper').value;
      const body = `<rect width="${s}" height="${s}" fill="${paper}"/>\n    ` + motifs[$('motif').value](s, ink);
      const tile = $('tile');
      tile.setAttribute('width', s);
      tile.setAttribute('height', s);
      if (r) tile.setAttribute('patternTransform', `rotate(${r})`); else tile.removeAttribute('patternTransform');
      tile.innerHTML = body;
      const tf = r ? ` patternTransform="rotate(${r})"` : '';
      $('code').textContent = `<pattern id="tile" width="${s}" height="${s}"\n         patternUnits="userSpaceOnUse"${tf}>\n    ${body}\n</pattern>`;
      $('size').nextElementSibling.value = s;
      $('rot').nextElementSibling.value = r + '°';
    }
    $('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText($('code').textContent); $('copy').textContent = 'Copied'; }
      catch { $('copy').textContent = 'Select & copy'; }
      setTimeout(() => { $('copy').textContent = 'Copy'; }, 1200);
    });
    document.querySelectorAll('select, input').forEach((el) => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
