<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>30-2 Animated SVG in an img Element</title>
</head>
<body class="demo">
  <div class="stage">
    <figure>
      <picture>
        <source media="(prefers-reduced-motion: reduce)" srcset="spinner-static.svg">
        <img src="spinner-smil.svg" width="120" height="120" alt="Spinner animated with SMIL, loaded through an img element">
      </picture>
      <figcaption>SMIL · spinner-smil.svg</figcaption>
    </figure>
    <figure>
      <picture>
        <source media="(prefers-reduced-motion: reduce)" srcset="spinner-static.svg">
        <img src="spinner-css.svg" width="120" height="120" alt="Spinner animated with CSS keyframes, loaded through an img element">
      </picture>
      <figcaption>CSS @keyframes · spinner-css.svg</figcaption>
    </figure>
    <figure>
      <picture>
        <source media="(prefers-reduced-motion: reduce)" srcset="spinner-static.svg">
        <img src="spinner-js.svg" width="120" height="120" alt="Spinner animated with a script, loaded through an img element">
      </picture>
      <figcaption>JavaScript · spinner-js.svg</figcaption>
    </figure>
  </div>
</body>
</html>
