<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 43-1 · Starter</title>
  <style>
    .btn { font: inherit; font-size: 14px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    input, select { accent-color: var(--accent); }
    .chev-btn { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    .chev path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .chev path { d: path("M5 9 L12 16 L19 9"); transition: d .3s; }
    .chev-btn[aria-expanded="true"] path { d: path("M5 15 L12 8 L19 15"); }
  </style>
</head>
<body class="demo">
  <button id="toggle" class="chev-btn" type="button" aria-expanded="false" aria-label="Show details">
    <svg class="chev" width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9 L12 16 L19 9"/></svg>
  </button>
  <script>
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => toggle.setAttribute('aria-expanded', toggle.getAttribute('aria-expanded') !== 'true'));
  </script>
</body>
</html>
